<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar dia letivo extra — Duas colunas (interativo)</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
  <style>
    html, body, #root { margin: 0; height: 100%; }
    body { background: #5b6470; }
    /* faded app behind the scrim */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1;
      background:
        repeating-linear-gradient(#fff 0 47px, #eef0f3 47px 60px) 0 56px/100% 100% no-repeat,
        #f8f9fb;
    }
    .turmas-scroll::-webkit-scrollbar { width: 8px; }
    .turmas-scroll::-webkit-scrollbar-thumb { background: #C3C8D1; border-radius: 999px; }
    .turmas-scroll::-webkit-scrollbar-track { background: transparent; }
    @keyframes slideup { from { transform: translateY(16px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    .toast-bar { animation: shrink 3200ms linear forwards; }
    @keyframes shrink { from { width: 100% } to { width: 0% } }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="interactive-twocol.jsx"></script>
</body>
</html>
