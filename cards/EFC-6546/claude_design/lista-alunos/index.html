/* ── Breakpoint ── */
const useBreakpoint = () => {
  const [w, setW] = useState(window.innerWidth);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return { isMobile: w < 640, isTablet: w < 1100, width: w };
};

/* ── Filter meta ── */
const FILTER_META = [
  { id: 'anoLetivo', label: 'Ano letivo',  required: true,  options: ['2023', '2024', '2025', '2026'] },
  { id: 'rede',      label: 'Rede',        required: true,  options: ['Elite', 'Forte', 'Militar'] },
  { id: 'escola',    label: 'Escola',      required: true,  options: ['Bangu', 'Copacabana', 'Tijuca', 'Botafogo'] },
  { id: 'serie',     label: 'Série',       required: false, options: ['6º ano', '7º ano', '8º ano', '9º ano'] },
  { id: 'turma',     label: 'Turma',       required: false, options: ['Turma A', 'Turma B', 'Turma C'] },
];

/* ── Filter Panel (inline, opens downward) ── */
const FilterPanel = ({ open, onClose, filters, onApply }) => {
  const [local, setLocal] = useState({ ...filters });
  useEffect(() => { if (open) setLocal({ ...filters }); }, [open]);

  const set = (k, v) => setLocal(f => ({ ...f, [k]: v }));
  const clear = () => setLocal({ anoLetivo: '', rede: '', escola: '', serie: '', turma: '', matriculados: true });
  const apply = () => { onApply(local); onClose(); };

  const requiredFilled = local.anoLetivo && local.rede && local.escola;

  const Field = ({ meta }) => (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1, minWidth: 160 }}>
      <label style={{
        fontFamily: 'var(--font-display-family)', fontWeight: 700, fontSize: 14, lineHeight: '14px',
        color: '#0F0F10', display: 'flex', gap: 4,
      }}>
        {meta.label}
        {meta.required && <span style={{ color: 'var(--color-error)' }}>*</span>}
      </label>
      <div style={{ position: 'relative' }}>
        <select value={local[meta.id]} onChange={e => set(meta.id, e.target.value)} style={{
          width: '100%', height: 40, padding: '8px 36px 8px 16px', borderRadius: 8,
          border: `1px solid ${local[meta.id] ? 'var(--color-primary)' : '#ADB2BA'}`,
          fontFamily: 'var(--font-body-family)', fontWeight: 400, fontSize: 16, lineHeight: '24px',
          color: local[meta.id] ? '#0F0F10' : '#65686E',
          background: '#fff', cursor: 'pointer', appearance: 'none', outline: 'none',
        }}>
          <option value="">{meta.label}</option>
          {meta.options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
        <MS name="expand_more" size={24} color="var(--color-primary)" style={{
          position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none',
        }} />
      </div>
    </div>
  );

  if (!open) return null;

  return (
    <div style={{
      width: '100%',
      borderRadius: 8,
      filter: 'drop-shadow(0px 0px 8px rgba(0, 23, 31, 0.2))',
      marginBottom: 8,
      animation: 'fadeSlideDown 200ms cubic-bezier(0.16,1,0.3,1)',
    }}>
      {/* Content */}
      <div style={{
        background: '#fff', borderRadius: '8px 8px 0 0',
        padding: 24, display: 'flex', flexDirection: 'column', gap: 16,
      }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <span style={{
            flex: 1, fontFamily: 'var(--font-display-family)', fontWeight: 600,
            fontSize: 24, lineHeight: '32px', color: '#0F0F10',
          }}>Escolha seus filtros</span>
          <button onClick={onClose} style={{
            width: 40, height: 40, borderRadius: 24, border: 0,
            background: 'transparent', cursor: 'pointer',
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            transition: 'background 140ms',
          }}
          onMouseOver={(e) => e.currentTarget.style.background = '#F8F9FB'}
          onMouseOut={(e) => e.currentTarget.style.background = 'transparent'}>
            <MS name="close" size={24} color="var(--color-primary)" />
          </button>
        </div>

        {/* Filter fields row */}
        <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
          {FILTER_META.map(m => <Field key={m.id} meta={m} />)}
        </div>

        {/* Apenas matriculados */}
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', width: 'fit-content' }}>
          <input type="checkbox" checked={!!local.matriculados} onChange={e => set('matriculados', e.target.checked)}
            style={{ accentColor: 'var(--color-primary)', width: 16, height: 16, cursor: 'pointer' }} />
          <span style={{ fontFamily: 'var(--font-body-family)', fontSize: 14, fontWeight: 600, color: '#0F0F10' }}>Apenas alunos matriculados</span>
        </label>
      </div>

      {/* Footer */}
      <div style={{
        background: '#F8F9FB', borderRadius: '0 0 8px 8px',
        padding: 24, display: 'flex', justifyContent: 'flex-end', gap: 8,
      }}>
        <button onClick={clear} style={{
          height: 40, padding: '8px 16px', borderRadius: 8,
          background: 'transparent', border: '1px solid #9D0364',
          fontFamily: 'var(--font-display-family)', fontWeight: 700, fontSize: 16,
          lineHeight: '16px', color: '#9D0364', cursor: 'pointer',
          transition: 'background 140ms',
        }}
        onMouseOver={(e) => e.currentTarget.style.background = '#FDF0F7'}
        onMouseOut={(e) => e.currentTarget.style.background = 'transparent'}>
          Limpar
        </button>
        <button onClick={apply} disabled={!requiredFilled} style={{
          height: 40, padding: '8px 16px', borderRadius: 8, border: 0,
          background: requiredFilled ? '#9D0364' : '#ADB2BA',
          fontFamily: 'var(--font-display-family)', fontWeight: 700, fontSize: 16,
          lineHeight: '16px', color: '#fff',
          cursor: requiredFilled ? 'pointer' : 'not-allowed',
          transition: 'background 140ms',
        }}
        onMouseOver={(e) => { if (requiredFilled) e.currentTarget.style.background = '#7A0250'; }}
        onMouseOut={(e) => { e.currentTarget.style.background = requiredFilled ? '#9D0364' : '#ADB2BA'; }}>
          Filtrar
        </button>
      </div>
    </div>
  );
};

/* ── Sort Dropdown ── */
const SortDropdown = ({ value, onChange }) => {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const opts = [
    { id: 'alfabetica', label: 'Ordem alfabética' },
    { id: 'freq-desc',  label: 'Maior frequência' },
    { id: 'freq-asc',   label: 'Menor frequência' },
    { id: 'neg-desc',   label: 'Mais ocorrências' },
  ];
  useEffect(() => {
    const h = (e) => { if (!ref.current?.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const current = opts.find(o => o.id === value) || opts[0];
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button className="dropdown-btn" onClick={() => setOpen(o => !o)}>
        {current.label}
        <MS name={open ? 'expand_less' : 'expand_more'} size={18} color="#65686E" />
      </button>
      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 4px)', right: 0, width: 210, zIndex: 20,
          background: '#fff', border: '1px solid #EBEDF1', borderRadius: 8,
          boxShadow: '0 4px 16px rgba(0,23,31,0.10)', overflow: 'hidden',
        }}>
          {opts.map(o => (
            <button key={o.id} onClick={() => { onChange(o.id); setOpen(false); }} style={{
              display: 'flex', alignItems: 'center', gap: 8, width: '100%', height: 40, padding: '0 14px',
              background: o.id === value ? 'var(--color-primary-light3)' : '#fff', border: 0, cursor: 'pointer',
              fontFamily: 'var(--font-body-family)', fontSize: 14,
              color: o.id === value ? 'var(--color-primary)' : '#0F0F10',
              fontWeight: o.id === value ? 700 : 400, textAlign: 'left',
            }}
            onMouseOver={(e) => { if (o.id !== value) e.currentTarget.style.background = '#F8F9FB'; }}
            onMouseOut={(e) => { if (o.id !== value) e.currentTarget.style.background = 'var(--color-primary-light3)' }}>
              {o.id === value
                ? <MS name="check" size={16} color="var(--color-primary)" />
                : <span style={{ width: 16 }} />}
              {o.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

/* ── Indicadores Dropdown ── */

  const opts = [

    document.addEventListener('mousedown', h);

  }, []);
  const current = opts.find(o => o.id === value);
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button className="dropdown-btn" onClick={() => setOpen(o => !o)}>
        {current ? current.label : 'Filtre indicadores'}
        <MS name={open ? 'expand_less' : 'expand_more'} size={18} color="#65686E" />
      </button>
      {open && (
        <div style={{

          background: '#fff', border: '1px solid #EBEDF1', borderRadius: 8,
          boxShadow: '0 4px 16px rgba(0,23,31,0.10)', overflow: 'hidden',
        }}>
          {value && (
            <button onClick={() => { onChange(''); setOpen(false); }} style={{
              display: 'flex', alignItems: 'center', gap: 8, width: '100%', height: 40, padding: '0 14px',
              background: '#fff', border: 0, borderBottom: '1px solid #EBEDF1', cursor: 'pointer',
              fontFamily: 'var(--font-body-family)', fontSize: 14, color: '#ADB2BA',
              fontWeight: 400, textAlign: 'left',
            }}
            onMouseOver={(e) => e.currentTarget.style.background = '#F8F9FB'}
            onMouseOut={(e) => e.currentTarget.style.background = '#fff'}>
              <MS name="close" size={16} color="#ADB2BA" />
              Limpar filtro
            </button>
          )}
          {opts.map(o => (
            <button key={o.id} onClick={() => { onChange(o.id); setOpen(false); }} style={{
              display: 'flex', alignItems: 'center', gap: 8, width: '100%', height: 40, padding: '0 14px',
              background: o.id === value ? 'var(--color-primary-light3)' : '#fff', border: 0, cursor: 'pointer',
              fontFamily: 'var(--font-body-family)', fontSize: 14,
              color: o.id === value ? 'var(--color-primary)' : '#0F0F10',
              fontWeight: o.id === value ? 700 : 400, textAlign: 'left',
            }}
            onMouseOver={(e) => { if (o.id !== value) e.currentTarget.style.background = '#F8F9FB'; }}
            onMouseOut={(e) => { if (o.id !== value) e.currentTarget.style.background = '#fff'; }}>
              {o.id === value
                ? <MS name="check" size={16} color="var(--color-primary)" />
                : <span style={{ width: 16 }} />}
              {o.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

/* ── App ── */
const App = () => {
  const { isMobile, isTablet } = useBreakpoint();
  const [filterOpen, setFilterOpen] = useState(false);
  const [filters, setFilters] = useState({ anoLetivo: '2025', rede: 'Elite', escola: 'Bangu', serie: '', turma: '', matriculados: true });
  const [search, setSearch] = useState('');
  const [ordem, setOrdem] = useState('alfabetica');
  const [indicador, setIndicador] = useState('');

  const activeChips = useMemo(() => {
    const iconMap = { anoLetivo: 'calendar_today', rede: 'school', escola: 'location_on', serie: 'class', turma: 'group' };
    return Object.entries(filters).filter(([, v]) => v).map(([k, v]) => ({ key: k, value: v, icon: iconMap[k] }));
  }, [filters]);

  const removeChip = (key) => setFilters(f => ({ ...f, [key]: '' }));

  const students = useMemo(() => {
    let list = STUDENTS.filter(s =>
      !search || s.nome.toLowerCase().includes(search.toLowerCase()) || s.mat.includes(search)
    );
    if (filters.matriculados) list = list.filter(s => s.status !== 'DESLIGADO');
    if (indicador === 'sem-atendimento') list = list.filter(s => s.atend === 0);
    if (indicador === 'meta-atendimento') list = list.filter(s => s.atend >= 3);
    if (ordem === 'alfabetica') list = [...list].sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
    else if (ordem === 'freq-desc') list = [...list].sort((a, b) => b.freq - a.freq);
    else if (ordem === 'freq-asc')  list = [...list].sort((a, b) => a.freq - b.freq);
    else if (ordem === 'neg-desc')  list = [...list].sort((a, b) => b.neg - a.neg);
    return list;
  }, [search, ordem, indicador, filters.matriculados]);

  const pad = isMobile ? '0 16px' : isTablet ? '0 24px' : '0 32px';

  return (
    <div style={{ minHeight: '100vh', background: '#F8F9FB' }}>
      <TopNav isMobile={isMobile} />

      <div style={{ maxWidth: 1400, margin: '0 auto', padding: `24px ${isMobile ? '16px' : isTablet ? '24px' : '32px'} 0` }}>
        {/* Title */}
        <h1 style={{
          margin: '0 0 20px',
          fontFamily: 'var(--font-display-family)', fontWeight: 600,
          fontSize: isMobile ? 22 : 32, color: '#0F0F10',
          letterSpacing: '-0.01em', lineHeight: 1.2,
        }}>Painel do Aluno</h1>

        {/* Filter bar */}
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center', marginBottom: 18 }}>
          {/* Filtro button */}
          <button onClick={() => setFilterOpen(true)} style={{
            display: 'inline-flex', alignItems: 'center', gap: 8,
            height: 40, padding: '0 16px',
            background: 'var(--color-secondary)', border: 0, borderRadius: 8,
            cursor: 'pointer',
            fontFamily: 'var(--font-display-family)', fontWeight: 700, fontSize: 14, color: '#fff',
            transition: 'opacity 160ms', flexShrink: 0,
          }}
          onMouseOver={(e) => e.currentTarget.style.filter = 'brightness(0.9)'}
          onMouseOut={(e) => e.currentTarget.style.filter = 'none'}>
            <MS name="filter_alt" size={24} color="#fff" />
            {!isMobile && (
              <span style={{ fontFamily: 'var(--font-display-family)', fontWeight: 700, fontSize: 16, lineHeight: '16px', color: '#fff' }}>Filtro</span>
            )}
            {activeChips.length > 0 && (
              <span style={{
                width: 24, height: 24, borderRadius: 152, background: '#fff',
                color: '#9D0364',
                fontFamily: 'var(--font-body-family)', fontWeight: 700, fontSize: 16,
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
              }}>{activeChips.length}</span>
            )}
          </button>

          {/* Search */}
          <div style={{
            display: 'flex', alignItems: 'center', gap: 8,
            height: 40, padding: '8px 16px',
            background: '#fff', border: '1px solid #ADB2BA', borderRadius: 8,
            flex: isMobile ? '1 1 100%' : '0 1 280px',
            order: isMobile ? -1 : 0,
          }}>
            <MS name="person_search" size={18} color="#ADB2BA" />
            <input
              value={search} onChange={e => setSearch(e.target.value)}
              placeholder="Buscar por nome ou RA"
              style={{
                border: 0, outline: 0, flex: 1, minWidth: 0,
                fontFamily: 'var(--font-body-family)', fontWeight: 400, fontSize: 16, lineHeight: '24px', color: '#0F0F10',
                background: 'transparent',
              }}
            />
            {search && (
              <button onClick={() => setSearch('')} style={{ border: 0, background: 'none', cursor: 'pointer', padding: 0, display: 'flex' }}>
                <MS name="close" size={16} color="#ADB2BA" />
              </button>
            )}
          </div>

          {/* Active filter chips */}
          {activeChips.map(chip => (
            <div key={chip.key} className="filter-chip">
              <MS name={chip.icon} size={16} color="#9D0364" />
              <span>{chip.value}</span>
            </div>
          ))}
        </div>

        {/* Inline filter panel */}
        {filterOpen && (
          <FilterPanel
            open={filterOpen}
            onClose={() => setFilterOpen(false)}
            filters={filters}
            onApply={(f) => { setFilters(f); }}
          />
        )}

        {/* Count + sort */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          marginBottom: 18, flexWrap: 'wrap',
        }}>
          <span style={{
            flex: 1, fontFamily: 'var(--font-body-family)', fontSize: 14, color: '#65686E',
          }}>
            <b style={{ color: '#0F0F10', fontWeight: 700, fontFamily: 'var(--font-display-family)' }}>{students.length}</b> alunos
          </span>
          <IndicadoresDropdown value={indicador} onChange={setIndicador} />
          <SortDropdown value={ordem} onChange={setOrdem} />
        </div>

        {/* Grid */}
        {students.length > 0 ? (
          <div className="student-grid">
            {students.map(s => <StudentCard key={s.id} student={s} />)}
          </div>
        ) : (
          <div style={{
            minHeight: 320, display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center', gap: 12,
          }}>
            <div style={{
              width: 64, height: 64, borderRadius: 16, background: '#F8F9FB',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <MS name="search_off" size={32} color="#ADB2BA" />
            </div>
            <div style={{ fontFamily: 'var(--font-display-family)', fontWeight: 600, fontSize: 16, color: '#3D3F42' }}>Nenhum aluno encontrado</div>
            <div style={{ fontFamily: 'var(--font-body-family)', fontSize: 14, color: '#ADB2BA' }}>Tente ajustar os filtros ou a busca</div>
          </div>
        )}
      </div>


    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
