<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Gestão Escolar — Painel do Aluno</title>

  <!-- ext-resource-dependency: owl agent avatar -->
  <meta name="ext-resource-dependency" content="assets/owl-agent.png" data-resource-id="owlAgent" />

  <template id="__bundler_thumbnail" data-bg-color="#F8F9FB">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <!-- Nav bar -->
      <rect x="0" y="0" width="120" height="11" fill="#ffffff"/>
      <rect x="6" y="2.5" width="16" height="6" rx="2" fill="#242CC2"/>
      <!-- Left card -->
      <rect x="6" y="16" width="34" height="58" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <rect x="8" y="18" width="30" height="10" rx="2" fill="#242CC2"/>
      <rect x="10" y="31" width="14" height="2" rx="1" fill="#C3C8D1"/>
      <rect x="10" y="35" width="22" height="2" rx="1" fill="#EBEDF1"/>
      <rect x="10" y="39" width="18" height="2" rx="1" fill="#EBEDF1"/>
      <rect x="10" y="46" width="28" height="22" rx="2" fill="#F8F9FB"/>
      <!-- Right panel -->
      <rect x="44" y="16" width="70" height="58" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <rect x="47" y="19" width="64" height="8" rx="2" fill="#F0F1FE"/>
      <!-- Tabs -->
      <rect x="47" y="30" width="10" height="2" rx="1" fill="#C3C8D1"/>
      <rect x="60" y="30" width="13" height="2" rx="1" fill="#242CC2"/>
      <rect x="60" y="33" width="13" height="1" rx="0.5" fill="#242CC2"/>
      <rect x="76" y="30" width="11" height="2" rx="1" fill="#C3C8D1"/>
      <!-- Content lines -->
      <rect x="47" y="38" width="30" height="3" rx="1.5" fill="#242CC2" opacity="0.8"/>
      <rect x="47" y="44" width="64" height="2" rx="1" fill="#EBEDF1"/>
      <rect x="47" y="48" width="64" height="2" rx="1" fill="#EBEDF1"/>
      <rect x="47" y="52" width="48" height="2" rx="1" fill="#EBEDF1"/>
    </svg>
  </template>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #F8F9FB; }
    * { box-sizing: border-box; }
    button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    @keyframes typing {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Custom scrollbar in drawer */
    aside *::-webkit-scrollbar { width: 6px; }
    aside *::-webkit-scrollbar-thumb { background: #C3C8D1; border-radius: 999px; }
    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .info-tip:hover .info-tip-bubble { opacity: 1 !important; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script>
    // Suppress Recharts defaultProps deprecation noise from React 18.3
    const _ce = console.error;
    console.error = (...a) => {
      if (typeof a[0] === 'string' && a[0].includes('defaultProps')) return;
      _ce(...a);
    };
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="TopNav.jsx"></script>
  <script type="text/babel" src="PageHeader.jsx"></script>
  <script type="text/babel" src="StudentInfoCard.jsx"></script>
  <script type="text/babel" src="AtendimentoTab.jsx"></script>
  <script type="text/babel" src="AnamneseTab.jsx"></script>
  <script type="text/babel" src="OcorrenciasTab.jsx"></script>
  <script type="text/babel" src="DocumentosTab.jsx"></script>
  <script type="text/babel" src="RightColumn.jsx"></script>
  <script type="text/babel" src="ChatDrawer.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
