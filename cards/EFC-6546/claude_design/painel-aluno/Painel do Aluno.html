<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Gestão Escolar — Painel do Aluno</title>

  <!-- ext-resource-dependency: owl agent avatar -->
  <meta name="ext-resource-dependency" content="assets/owl-agent.png" data-resource-id="owlAgent" />

  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #F8F9FB; }
    * { box-sizing: border-box; }
    button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    @keyframes typing {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    aside *::-webkit-scrollbar { width: 6px; }
    aside *::-webkit-scrollbar-thumb { background: #C3C8D1; border-radius: 999px; }
    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .info-tip:hover .info-tip-bubble { opacity: 1 !important; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script>
    const _ce = console.error;
    console.error = (...a) => {
      if (typeof a[0] === 'string' && a[0].includes('defaultProps')) return;
      _ce(...a);
    };
  </script>

  <template id="__bundler_thumbnail" data-bg-color="#F8F9FB">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <!-- Nav bar -->
      <rect x="0" y="0" width="120" height="11" fill="#ffffff"/>
      <rect x="6" y="2.5" width="16" height="6" rx="2" fill="url(#g1)"/>
      <!-- Left card -->
      <rect x="6" y="16" width="34" height="58" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <!-- Avatar -->
      <circle cx="16" cy="30" r="7" fill="#FFE0C4"/>
      <!-- KPI chips -->
      <rect x="8" y="42" width="9" height="9" rx="2" fill="#FFF3DF"/>
      <rect x="19" y="42" width="9" height="9" rx="2" fill="#EBEDF1"/>
      <rect x="30" y="42" width="9" height="9" rx="2" fill="#FBE3DC"/>
      <!-- Behaviour row -->
      <rect x="8" y="54" width="30" height="7" rx="3" fill="#F8F9FB" stroke="#EBEDF1" stroke-width="0.5"/>
      <!-- Right: resumo card -->
      <rect x="46" y="16" width="68" height="16" rx="3" fill="#F7F8FF" stroke="#C3C8D1" stroke-width="0.5"/>
      <rect x="50" y="20" width="32" height="2" rx="1" fill="#242CC2" opacity=".5"/>
      <rect x="50" y="24" width="56" height="2" rx="1" fill="#C3C8D1"/>
      <rect x="50" y="28" width="48" height="2" rx="1" fill="#C3C8D1"/>
      <!-- Right: tabs + chart card -->
      <rect x="46" y="36" width="68" height="38" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <!-- Chart bars -->
      <rect x="50" y="62" width="3" height="8"  rx="1" fill="#28975A"/>
      <rect x="55" y="56" width="3" height="14" rx="1" fill="#28975A"/>
      <rect x="60" y="59" width="3" height="11" rx="1" fill="#28975A"/>
      <rect x="65" y="52" width="3" height="18" rx="1" fill="#28975A"/>
      <rect x="70" y="57" width="3" height="13" rx="1" fill="#28975A"/>
      <rect x="75" y="54" width="3" height="16" rx="1" fill="#28975A"/>
      <rect x="80" y="60" width="3" height="10" rx="1" fill="#28975A"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#30B7BE"/>
          <stop offset="100%" stop-color="#39D881"/>
        </linearGradient>
      </defs>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="TopNav.jsx"></script>
  <script type="text/babel" src="PageHeader.jsx"></script>
  <script type="text/babel" src="StudentInfoCard.jsx"></script>
  <script type="text/babel" src="RightColumn.jsx"></script>
  <script type="text/babel" src="ChatDrawer.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
