<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Gestão Escolar — Portal do Aluno</title>

  <!-- Bundler resource -->
  <meta name="ext-resource-dependency" content="painel-aluno/assets/owl-agent.png" data-resource-id="owlAgent" />

  <template id="__bundler_thumbnail" data-bg-color="#F8F9FB">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="120" height="10" fill="#ffffff"/>
      <rect x="5" y="2" width="14" height="6" rx="2" fill="#242CC2"/>
      <rect x="5"  y="14" width="52" height="24" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <circle cx="15" cy="21" r="5" fill="#E8E8F0"/>
      <rect x="23" y="17" width="28" height="3" rx="1.5" fill="#0F0F10"/>
      <rect x="23" y="22" width="20" height="2" rx="1" fill="#C3C8D1"/>
      <rect x="63" y="14" width="52" height="24" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <circle cx="73" cy="21" r="5" fill="#FFE0C4"/>
      <rect x="81" y="17" width="28" height="3" rx="1.5" fill="#0F0F10"/>
      <rect x="81" y="22" width="20" height="2" rx="1" fill="#C3C8D1"/>
      <rect x="5"  y="42" width="52" height="24" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <circle cx="15" cy="49" r="5" fill="#FBE3DC"/>
      <rect x="23" y="45" width="28" height="3" rx="1.5" fill="#0F0F10"/>
      <rect x="63" y="42" width="52" height="24" rx="3" fill="#ffffff" stroke="#EBEDF1" stroke-width="0.5"/>
      <circle cx="73" cy="49" r="5" fill="#D9F5E4"/>
      <rect x="81" y="45" width="28" height="3" rx="1.5" fill="#0F0F10"/>
    </svg>
  </template>

  <link rel="stylesheet" href="painel-aluno/colors_and_type.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #F8F9FB; }
    * { box-sizing: border-box; }
    button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    /* Lista styles */
    .student-card { background: #fff; border: 1px solid #EBEDF1; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0px 4px 8px rgba(0,23,31,0.06); transition: border-color 180ms, box-shadow 180ms; }
    .student-card:hover { border-color: var(--color-primary); box-shadow: 0px 8px 16px rgba(0,23,31,0.12); }
    .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; padding-bottom: 40px; }
    @media (max-width: 640px) { .student-grid { grid-template-columns: 1fr; } }
    .action-btn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px; background: transparent; border: 0; border-radius: 6px; cursor: pointer; font-family: var(--font-body-family); font-weight: 700; font-size: 12px; color: var(--color-primary); text-decoration: none; line-height: 16px; transition: background 140ms; white-space: nowrap; }
    .action-btn:hover { background: var(--color-primary-light3); }
    .filter-chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; background: #fff; border: 1px solid #9D0364; border-radius: 16px; font-family: var(--font-body-family); font-size: 12px; font-weight: 700; color: #9D0364; }
    .dropdown-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; background: #fff; border: 1px solid #C3C8D1; border-radius: 8px; cursor: pointer; font-family: var(--font-body-family); font-size: 14px; color: #0F0F10; transition: border-color 140ms; }
    .dropdown-btn:hover { border-color: var(--color-primary); }

    /* Animations */
    @keyframes typing { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeSlideRight { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    .info-tip:hover .info-tip-bubble { opacity: 1 !important; }
    aside *::-webkit-scrollbar { width: 6px; }
    aside *::-webkit-scrollbar-thumb { background: #C3C8D1; border-radius: 999px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script>
    const _ce = console.error;
    console.error = (...a) => { if (typeof a[0] === 'string' && a[0].includes('defaultProps')) return; _ce(...a); };
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- Painel scripts -->
  <script type="text/babel" src="painel-aluno/tweaks-panel.jsx"></script>
  <script type="text/babel" src="painel-aluno/primitives.jsx"></script>
  <script type="text/babel" src="painel-aluno/TopNav.jsx"></script>
  <script type="text/babel" src="painel-aluno/PageHeader.jsx"></script>
  <script type="text/babel" src="painel-aluno/StudentInfoCard.jsx"></script>
  <script type="text/babel" src="painel-aluno/AtendimentoTab.jsx"></script>
  <script type="text/babel" src="painel-aluno/AnamneseTab.jsx"></script>
  <script type="text/babel" src="painel-aluno/OcorrenciasTab.jsx"></script>
  <script type="text/babel" src="painel-aluno/DocumentosTab.jsx"></script>
  <script type="text/babel" src="painel-aluno/RightColumn.jsx"></script>
  <script type="text/babel" src="painel-aluno/ChatDrawer.jsx"></script>

  <!-- Lista script -->
  <script type="text/babel" src="lista-alunos/ListaApp.jsx"></script>

  <!-- Router -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = {
      viewMode: 'Por dia',
      frequenciaVazia: false,
      pedagogicoVazio: false,
      podeExcluir: false,
      atendimentoVazio: false,
      ocorrenciasVazio: false,
      anamneseVazia: false,
      documentosVazio: false,
      temComportamento: true,
      resumoStatus: 'ok',
    };

    const PainelScreen = ({ student, initialTab = 'Pedagógico' }) => {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [year, setYear] = useState(2025);
      const [subTab, setSubTab] = useState('Perfil');
      const [tab, setTab] = useState(initialTab);
      const [chatOpen, setChatOpen] = useState(false);
      const [pendingQuestion, setPendingQuestion] = useState(null);
      const { isCompact, isMobile } = useBreakpoint();
      const askFromChip = q => { setPendingQuestion(q); setChatOpen(true); };
      const openEmpty = () => { setPendingQuestion(null); setChatOpen(true); };
      return (
        <div style={{ minHeight: '100vh', background: '#F8F9FB' }}>
          <TweaksPanel>
            <TweakSection label="Frequência" />
            <TweakRadio label="Visualização" value={t.viewMode} options={['Por dia','Por tempo de aula']} onChange={v => setTweak('viewMode', v)} />
            <TweakSection label="Estados vazios" />
            <TweakToggle label="Frequência vazia" value={t.frequenciaVazia} onChange={v => setTweak('frequenciaVazia', v)} />
            <TweakToggle label="Pedagógico vazio" value={t.pedagogicoVazio} onChange={v => setTweak('pedagogicoVazio', v)} />
            <TweakToggle label="Atendimento vazio" value={t.atendimentoVazio} onChange={v => setTweak('atendimentoVazio', v)} />
            <TweakToggle label="Ocorrências vazio" value={t.ocorrenciasVazio} onChange={v => setTweak('ocorrenciasVazio', v)} />
            <TweakToggle label="Anamnese não respondida" value={t.anamneseVazia} onChange={v => setTweak('anamneseVazia', v)} />
            <TweakToggle label="Documentos vazio" value={t.documentosVazio} onChange={v => setTweak('documentosVazio', v)} />
            <TweakSection label="Regras por escola" />
            <TweakToggle label="Escola registra comportamento" value={t.temComportamento} onChange={v => setTweak('temComportamento', v)} />
            <TweakSection label="Permissões" />
            <TweakToggle label="Pode excluir atendimentos/ocorrências" value={t.podeExcluir} onChange={v => setTweak('podeExcluir', v)} />
            <TweakSection label="Resumo Inteligente" />
            <TweakRadio label="Estado" value={t.resumoStatus} options={['ok','loading','error','empty']} onChange={v => setTweak('resumoStatus', v)} />
          </TweaksPanel>
          <TopNav />
          <PageHeader />
          <div style={{ maxWidth: 1400, margin: '0 auto', padding: isMobile ? '0 16px 48px' : isCompact ? '0 24px 48px' : '0 32px 48px', display: 'grid', gridTemplateColumns: isCompact ? '1fr' : '360px 1fr', gap: isCompact ? 16 : 24, alignItems: 'flex-start' }}>
            <StudentInfoCard student={student} subTab={subTab} setSubTab={setSubTab} year={year} onYearChange={setYear} viewMode={t.viewMode} frequenciaVazia={t.frequenciaVazia} temComportamento={t.temComportamento} />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
              <ResumoInteligente onChipClick={askFromChip} onPerguntarMais={openEmpty} status={t.resumoStatus} />
              <div style={{ background: '#fff', borderRadius: 12, border: '1px solid #EBEDF1', overflow: 'hidden' }}>
                <TabsRow active={tab} onChange={setTab} />
                <div style={{ padding: 24 }}>
                  {tab === 'Pedagógico'  && <PedagogicoTab isEmpty={t.pedagogicoVazio} />}
                  {tab === 'Atendimento' && <AtendimentoTab podeExcluir={t.podeExcluir} isEmpty={t.atendimentoVazio} />}
                  {tab === 'Anamnese'    && <AnamneseTab isEmpty={t.anamneseVazia} />}
                  {tab === 'Ocorrências' && <OcorrenciasTab podeExcluir={t.podeExcluir} isEmpty={t.ocorrenciasVazio} />}
                  {tab === 'Documentos'  && <DocumentosTab isEmpty={t.documentosVazio} />}
                </div>
              </div>
            </div>
          </div>
          <ChatFab onClick={() => setChatOpen(true)} hidden={chatOpen} />
          <ChatDrawer open={chatOpen} onClose={() => setChatOpen(false)} pendingQuestion={pendingQuestion} onQuestionConsumed={() => setPendingQuestion(null)} />
        </div>
      );
    };

    const PortalApp = () => {
      const [screen, setScreen] = useState('lista');
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [initialTab, setInitialTab] = useState('Pedagógico');

      useEffect(() => {
        window.__navToPainel = (student, tab) => { setSelectedStudent(student || null); setInitialTab(tab || 'Pedagógico'); setScreen('painel'); };
        window.__navToLista  = () => setScreen('lista');
        return () => { delete window.__navToPainel; delete window.__navToLista; };
      }, []);

      return screen === 'lista' ? <ListaApp /> : <PainelScreen key={(selectedStudent?.id || 0) + '-' + initialTab} student={selectedStudent} initialTab={initialTab} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<PortalApp />);
  </script>
</body>
</html>
