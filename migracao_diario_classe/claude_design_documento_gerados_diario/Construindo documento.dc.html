<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { margin: 0; }
  @keyframes elv-build {
    0%   { clip-path: inset(0 100% 0 0); opacity: 0; }
    6%   { opacity: 1; }
    17%  { clip-path: inset(0 0 0 0); }
    90%  { clip-path: inset(0 0 0 0); opacity: 1; }
    99%  { clip-path: inset(0 100% 0 0); opacity: 0; }
    100% { clip-path: inset(0 100% 0 0); opacity: 0; }
  }
  @keyframes elv-block {
    0%   { clip-path: inset(0 0 100% 0); opacity: 0; }
    8%   { opacity: 1; }
    24%  { clip-path: inset(0 0 0 0); }
    90%  { clip-path: inset(0 0 0 0); opacity: 1; }
    99%  { clip-path: inset(0 0 100% 0); opacity: 0; }
    100% { clip-path: inset(0 0 100% 0); opacity: 0; }
  }
  @keyframes elv-pop {
    0%   { transform: scale(.2); opacity: 0; }
    8%   { opacity: 1; }
    18%  { transform: scale(1); }
    90%  { transform: scale(1); opacity: 1; }
    99%  { transform: scale(.2); opacity: 0; }
    100% { transform: scale(.2); opacity: 0; }
  }
  @keyframes elv-shimmer {
    0%   { background-position: 160% 0; }
    100% { background-position: -160% 0; }
  }
  @keyframes elv-scan {
    0%   { transform: translateY(2px);   opacity: 0; }
    5%   { opacity: .95; }
    88%  { opacity: .95; }
    100% { transform: translateY(372px); opacity: 0; }
  }
  @keyframes elv-prog {
    0%   { width: 3%; }
    86%  { width: 98%; }
    99%  { width: 100%; }
    100% { width: 100%; }
  }
  @keyframes elv-dot {
    0%, 100% { opacity: .2; transform: translateY(0); }
    50%      { opacity: 1;  transform: translateY(-2px); }
  }
  @keyframes elv-mark {
    0%, 100% { opacity: .65; transform: scale(.94); }
    50%      { opacity: 1;   transform: scale(1); }
  }
  /* Fallback: if motion is reduced/disabled, show the ghost document built (not blank) */
  @media (prefers-reduced-motion: reduce) {
    [style*="elv-build"], [style*="elv-block"], [style*="elv-pop"] {
      animation: none !important; opacity: 1 !important; clip-path: none !important; transform: none !important;
    }
    [style*="elv-scan"] { display: none !important; }
    [style*="elv-prog"] { animation: none !important; width: 64% !important; }
    [style*="elv-dot"], [style*="elv-mark 2.4s"] { animation: none !important; }
  }
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:48px 24px;box-sizing:border-box;background:var(--bg-surface,#F8F9FB);font-family:var(--font-body-family);--elv-cycle:{{cycle}};--elv-accent:{{accent}};">

  <!-- Ghost document sheet -->
  <div style="position:relative;width:340px;height:452px;background:#fff;border:1px solid var(--border-subtle,#EBEDF1);border-radius:10px;box-shadow:var(--shadow-down-large,0 8px 16px 0 rgba(0,23,31,0.15));overflow:hidden;">

    <!-- Brand header edge -->
    <div style="position:absolute;top:0;left:0;right:0;height:5px;background:var(--brand-gradient-h,linear-gradient(90deg,#30B7BE 0%,#39D881 100%));"></div>

    <!-- Content area (clips the scan cursor) -->
    <div style="position:absolute;top:5px;left:0;right:0;bottom:0;padding:28px 26px;display:flex;flex-direction:column;gap:18px;overflow:hidden;">

      <!-- writing cursor -->
      <div style="position:absolute;left:24px;right:24px;top:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--elv-accent,#242CC2) 25%,var(--elv-accent,#242CC2) 75%,transparent);box-shadow:0 0 14px 3px color-mix(in srgb, var(--elv-accent,#242CC2) 45%, transparent);animation:elv-scan var(--elv-cycle,4.8s) cubic-bezier(.45,0,.2,1) infinite;"></div>

      <!-- header: avatar + title bars -->
      <div style="display:flex;align-items:center;gap:13px;">
        <div style="width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:transform,opacity;animation:elv-pop var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.03) infinite both, elv-shimmer 1.7s linear infinite;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:9px;">
          <div style="width:72%;height:13px;border-radius:6px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.06) infinite both, elv-shimmer 1.7s linear infinite;"></div>
          <div style="width:46%;height:10px;border-radius:5px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.09) infinite both, elv-shimmer 1.7s linear infinite;"></div>
        </div>
      </div>

      <!-- divider -->
      <div style="width:100%;height:7px;border-radius:4px;background:linear-gradient(90deg,#F1F2F5 0%,#F1F2F5 35%,#F8F9FB 50%,#F1F2F5 65%,#F1F2F5 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.13) infinite both, elv-shimmer 1.7s linear infinite;"></div>

      <!-- paragraph block 1 -->
      <div style="display:flex;flex-direction:column;gap:9px;">
        <div style="width:100%;height:11px;border-radius:6px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.17) infinite both, elv-shimmer 1.7s linear infinite;"></div>
        <div style="width:94%;height:11px;border-radius:6px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.20) infinite both, elv-shimmer 1.7s linear infinite;"></div>
        <div style="width:68%;height:11px;border-radius:6px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.23) infinite both, elv-shimmer 1.7s linear infinite;"></div>
      </div>

      <!-- embedded block / figure -->
      <div style="width:100%;height:78px;border-radius:8px;background:linear-gradient(90deg,#EEF0F3 0%,#EEF0F3 35%,#F6F7FA 50%,#EEF0F3 65%,#EEF0F3 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-block var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.29) infinite both, elv-shimmer 1.9s linear infinite;"></div>

      <!-- paragraph block 2 -->
      <div style="display:flex;flex-direction:column;gap:9px;">
        <div style="width:100%;height:11px;border-radius:6px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.42) infinite both, elv-shimmer 1.7s linear infinite;"></div>
        <div style="width:80%;height:11px;border-radius:6px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.45) infinite both, elv-shimmer 1.7s linear infinite;"></div>
      </div>

      <!-- chip row -->
      <div style="display:flex;gap:10px;margin-top:2px;">
        <div style="width:72px;height:24px;border-radius:999px;background:linear-gradient(90deg,#ECEDFF 0%,#ECEDFF 35%,#F5F5FF 50%,#ECEDFF 65%,#ECEDFF 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.50) infinite both, elv-shimmer 1.7s linear infinite;"></div>
        <div style="width:56px;height:24px;border-radius:999px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.53) infinite both, elv-shimmer 1.7s linear infinite;"></div>
        <div style="width:48px;height:24px;border-radius:999px;background:linear-gradient(90deg,#EBEDF1 0%,#EBEDF1 35%,#F4F5F8 50%,#EBEDF1 65%,#EBEDF1 100%);background-size:220% 100%;will-change:clip-path,opacity;animation:elv-build var(--elv-cycle,4.8s) cubic-bezier(.2,.7,.2,1) calc(var(--elv-cycle,4.8s) * 0.56) infinite both, elv-shimmer 1.7s linear infinite;"></div>
      </div>

    </div>
  </div>

  <!-- Status -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:340px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <svg viewBox="0 0 122.120 170" style="height:24px;width:auto;display:block;animation:elv-mark 2.4s ease-in-out infinite;" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="elv-mark-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#30B7BE"></stop><stop offset="1" stop-color="#39D881"></stop></linearGradient></defs>
        <path d="M 17.12 37.18 C 20.28 26.97 39.71 16.64 65 16.64 C 87.29 16.64 101.89 22.99 109.62 27.66 C 110.86 28.41 112.29 28.78 113.79 28.78 C 118.39 28.78 122.12 25.05 122.12 20.45 C 122.12 17.43 120.51 14.77 118.07 13.3 C 108.53 7.6 90.97 0 64.99 0 C 28.55 0 0 17.59 0 40.06 C 0 44.2 1.01 48.18 2.81 51.9 C 6.7 46.38 11.54 41.42 17.12 37.18 Z M 45.77 61.34 C 39.16 64.39 33.85 68.93 30.75 74.28 C 40.64 77.99 52.33 80.13 64.99 80.13 C 84.82 80.13 114.17 72.33 114.17 55.59 C 114.18 38.82 84.83 31 64.99 31 C 30.09 31 1.59 55.22 1.59 84.99 C 1.59 90.37 2.53 95.56 4.26 100.47 C 8.33 96.68 13.21 93.33 18.75 90.49 C 18.42 88.7 18.24 86.86 18.24 84.99 C 18.24 64.37 39.34 47.65 64.99 47.65 C 79.32 47.65 92.66 52.32 96.71 55.57 C 92.65 58.81 79.32 63.47 64.99 63.47 C 58.07 63.47 51.61 62.68 45.77 61.34 Z M 113.79 141.21 C 112.28 141.21 110.85 141.58 109.61 142.33 C 101.89 147 87.24 153.35 64.99 153.35 C 37.26 153.35 16.65 140.99 16.65 129.93 C 16.65 118.87 37.32 106.5 64.99 106.5 C 79.32 106.5 92.66 111.17 96.71 114.41 C 92.66 117.67 79.32 122.33 64.99 122.33 C 57.8 122.33 51 121 44.91 118.68 C 35.4 121.35 29.28 125.47 27.09 128.24 C 37.67 134.98 50.79 138.98 64.99 138.98 C 84.82 138.98 114.17 131.17 114.17 114.4 C 114.17 97.66 84.82 89.86 64.99 89.86 C 28.55 89.86 0 107.45 0 129.92 C 0 152.4 28.55 170 64.99 170 C 90.97 170 108.53 162.39 118.06 156.68 C 120.51 155.21 122.11 152.56 122.11 149.53 C 122.12 144.94 118.39 141.21 113.79 141.21 Z" fill="url(#elv-mark-grad)" fill-rule="nonzero"></path>
      </svg>
      <div style="display:flex;align-items:center;gap:1px;font-family:var(--font-display-family);font-weight:600;font-size:17px;line-height:1;color:var(--fg-primary,#0F0F10);">
        <span>{{title}}</span>
        <span style="display:inline-flex;align-items:center;gap:3px;margin-left:4px;color:var(--elv-accent,#242CC2);">
          <span style="width:4px;height:4px;border-radius:50%;background:currentColor;animation:elv-dot 1.4s ease-in-out infinite;"></span>
          <span style="width:4px;height:4px;border-radius:50%;background:currentColor;animation:elv-dot 1.4s ease-in-out .18s infinite;"></span>
          <span style="width:4px;height:4px;border-radius:50%;background:currentColor;animation:elv-dot 1.4s ease-in-out .36s infinite;"></span>
        </span>
      </div>
    </div>

    <div style="width:100%;height:6px;border-radius:999px;background:var(--border-subtle,#EBEDF1);overflow:hidden;">
      <div style="height:100%;border-radius:999px;background:var(--elv-accent,#242CC2);min-width:6px;animation:elv-prog var(--elv-cycle,4.8s) cubic-bezier(.45,0,.2,1) infinite;"></div>
    </div>

    <div style="font-family:var(--font-body-family);font-size:13px;line-height:18px;color:var(--fg-muted,#65686E);text-align:center;">{{subtitle}}</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 560, &quot;height&quot;: 640 },
  &quot;title&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Construindo documento&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;subtitle&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Organizando as informações do aluno&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#242CC2&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;speed&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Lento&quot;, &quot;Normal&quot;, &quot;Rápido&quot;], &quot;default&quot;: &quot;Normal&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  shouldComponentUpdate(nextProps) {
    const keys = ['title', 'subtitle', 'accentColor', 'speed'];
    return keys.some((k) => (nextProps || {})[k] !== this.props[k]);
  }
  renderVals() {
    const speed = this.props.speed ?? 'Normal';
    const cycle = speed === 'Lento' ? '6.6s' : speed === 'Rápido' ? '3.4s' : '4.8s';
    return {
      title: this.props.title ?? 'Construindo documento',
      subtitle: this.props.subtitle ?? 'Organizando as informações do aluno',
      accent: this.props.accentColor ?? '#242CC2',
      cycle: cycle,
    };
  }
}
</script>
</body>
</html>
