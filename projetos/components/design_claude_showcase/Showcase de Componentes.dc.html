const R = React, h = React.createElement;

const CATALOG = [
  { label: 'Primitivos', items: [
    { id:'button',    name:'Button',      icon:'smart_button',  group:'Primitivos', desc:'Ação principal do sistema. Fundo indigo #242CC2 em todas as variantes preenchidas; nunca usa o gradiente de marca. Suporta ícone, contador e três variantes de ênfase.' },
    { id:'iconButton',name:'Icon button', icon:'touch_app',     group:'Primitivos', desc:'Botão apenas com ícone, 40×40 (circular) ou 32×32 (quadrado). Usado em barras de ferramentas, cabeçalhos e ações compactas de tabela.' },
    { id:'input',     name:'Input',       icon:'text_fields',   group:'Primitivos', desc:'Campo de texto com rótulo, ícone opcional, texto de ajuda e estado de erro. Borda indigo e anel de foco de 3px a 24% de opacidade.' },
    { id:'tag',       name:'Tag',         icon:'sell',          group:'Primitivos', desc:'Rótulo em cápsula (raio 999) para categorias e status. Cor de fundo semântica com texto branco — âmbar usa texto escuro para contraste.' },
    { id:'avatar',    name:'Avatar',      icon:'account_circle',group:'Primitivos', desc:'Iniciais sobre o gradiente de marca teal→verde. Único lugar, junto do logo, onde o gradiente aparece. Tamanho configurável.' },
    { id:'alert',     name:'Alert',       icon:'campaign',      group:'Primitivos', desc:'Faixa de mensagem contextual com barra lateral colorida. Quatro variantes semânticas: info, sucesso, atenção e erro.' },
    { id:'toast',     name:'Toast',       icon:'notifications', group:'Primitivos', desc:'Notificação temporária fixada no canto inferior direito, com barra de tempo linear. Fecha automaticamente após a duração definida.' },
    { id:'skeleton',  name:'Skeleton',    icon:'blur_on',        group:'Primitivos', desc:'Placeholder de carregamento com efeito shimmer. Formas retângulo, arredondado, quadrado e círculo, controladas por largura, altura e raio.' },
    { id:'splitButton', name:'Split button', icon:'arrow_drop_down_circle', group:'Primitivos', desc:'Botão de ação principal com um segundo gatilho separado por divisor, que abre um menu de ações relacionadas. Mesmas variantes de cor do Button.' },
    { id:'groupButton', name:'Group button', icon:'view_column', group:'Primitivos', desc:'Conjunto de opções mutuamente exclusivas em um único bloco segmentado, com raio apenas nas bordas externas. Usado para alternar visualizações.' },
  ]},
  { label: 'Formulários', items: [
    { id:'checkbox',  name:'Checkbox',    icon:'check_box',          group:'Formulários', desc:'Seleção múltipla com três estados: selecionado, parcial (indeterminado) e não selecionado, além do estado desativado.' },
    { id:'radio',     name:'Radio',       icon:'radio_button_checked',group:'Formulários', desc:'Seleção única. RadioGroup organiza um conjunto de opções mutuamente exclusivas com rótulo.' },
    { id:'toggle',    name:'Toggle',      icon:'toggle_on',          group:'Formulários', desc:'Interruptor liga/desliga para preferências e ativações imediatas. Verde de sucesso quando ativo.' },
    { id:'datepicker',name:'Datepicker',  icon:'calendar_month',     group:'Formulários', desc:'Calendário mensal com navegação entre meses. Data selecionada em indigo; dia atual destacado. Formato DD/MM/AAAA.' },
    { id:'fileupload',name:'File upload', icon:'upload_file',        group:'Formulários', desc:'Área de arrastar e soltar com botão de seleção e lista de arquivos anexados removíveis.' },
    { id:'filterbar', name:'Filter bar',  icon:'filter_list',        group:'Formulários', desc:'Barra de busca combinada a um painel de filtros expansível com contador de filtros ativos e ações de aplicar/limpar.' },
    { id:'listboxTransfer', name:'Listbox transfer', icon:'swap_horiz', group:'Formulários', desc:'Duas listas lado a lado (disponíveis/selecionados) com transferência por clique nos itens e botões de mover. Busca em cada lado, "selecionar todos"/"remover todos" em indigo.' },
  ]},
  { label: 'Navegação', items: [
    { id:'tabs',      name:'Tabs',        icon:'tab',                 group:'Navegação', desc:'Abas com sublinhado indigo na ativa. Suportam ícone e contador por aba.' },
    { id:'breadcrumb',name:'Breadcrumb',  icon:'chevron_right',       group:'Navegação', desc:'Trilha de navegação hierárquica com separador em chevron. Último item sem link, indicando a página atual.' },
    { id:'pagination',name:'Pagination',  icon:'format_list_numbered',group:'Navegação', desc:'Paginação numérica com truncamento por reticências e controles de anterior/próximo.' },
  ]},
  { label: 'Estrutura', items: [
    { id:'toolbar',   name:'Toolbar',     icon:'view_week',    group:'Estrutura', desc:'Componente de agrupamento para botões e outros elementos, organizado em três seções — start, center e end — dentro de um contêiner com borda e raio de 8px.' },
    { id:'baseCard',  name:'Base card',   icon:'crop_square', group:'Estrutura', desc:'Contêiner genérico de 8px de raio para composições de conteúdo. Define os seis estados de interação do sistema: default, hover, focused, selected, disabled e dragged.' },
    { id:'avatarCard',name:'Avatar card', icon:'contact_page',group:'Estrutura', desc:'Variante do Base card com cabeçalho de avatar, nome e metadados, corpo com estatísticas e rodapé de ações — o padrão usado nos cartões de aluno da listagem.' },
    { id:'accordion', name:'Accordion',   icon:'unfold_more', group:'Estrutura', desc:'Lista de itens expansíveis. Um item isolado usa raio nos quatro cantos; em grupo, apenas o primeiro e o último item arredondam as pontas. Cabeçalho aberto usa fundo indigo claro e seta rotacionada.' },
    { id:'modal',     name:'Modal',       icon:'web_asset',   group:'Estrutura', desc:'Janela sobreposta com cabeçalho, corpo rolável e barra de ações. Raio de 16px e scrim escuro. Fecha ao clicar fora ou no X.' },
    { id:'table',     name:'Table',       icon:'table_rows',  group:'Estrutura', desc:'Tabela de dados com ordenação por coluna, seleção de linhas e renderização customizada de células (ex.: tags de status).' },
    { id:'studentCard',name:'Student card',icon:'badge',      group:'Estrutura', desc:'Composição completa da ficha do aluno: cabeçalho de perfil, cartões de estatísticas, alertas, atividades e painel lateral de responsável.' },
  ]},
];

const FLAT = CATALOG.flatMap(g => g.items);

const STUDENT = {
  name: 'Wanderson Uchiha', class: '1 ano A', track: 'Militar',
  email: 'wandinho.uchiha12@gmail.com.br', birth: '26/06/2010',
  faltas: 6, atrasos: 2, media: 8.4, status: 'Atenção',
};

class Component extends DCLogic {
  state = {
    selected: null,
    demo: {
      inputs: { a:'', b:'', c:'', d:'Valor inválido' },
      checks: { a:true, b:false, c:false },
      toggles: { a:true, b:false },
      radio: 'presencial',
      date: null,
      filters: {}, search: '',
      tab: 'dados', page: 1,
      splitOpen: false, groupA: 'lista', groupB: 'semana',
      ltLeft: ['Ana Diretora','Carlos Santos','Maria Silva','Wanderson Uchiha','João Pereira'],
      ltRight: ['Fernanda Lima'], ltStagedLeft: [], ltStagedRight: [], ltSearchL: '', ltSearchR: '',
      modal: false, toast: false,
      modalName: 'Wanderson Uchiha', modalEmail: 'wandinho.uchiha12@gmail.com.br',
    },
  };

  build(sel, d, set, W) {
    const row = (...kids) => h('div', { style:{ display:'flex', flexWrap:'wrap', gap:16, alignItems:'center' } }, kids);
    const col = (gap, ...kids) => h('div', { style:{ display:'flex', flexDirection:'column', gap, width:'100%' } }, kids);
    const { Button, IconButton, Input, Tag, Avatar, Alert, Checkbox, RadioGroup, Toggle, Datepicker, FileUpload, FilterBar, Tabs, Breadcrumb, Pagination, Table, StudentCard } = W;

    switch (sel) {
      case 'button': return [
        { label:'Variantes', code:
`<Button variant="fill">Salvar</Button>
<Button variant="outline">Editar</Button>
<Button variant="ghost">Cancelar</Button>
<Button variant="danger">Excluir</Button>`,
          el: row(
            h(Button,{variant:'fill'},'Salvar'),
            h(Button,{variant:'outline'},'Editar'),
            h(Button,{variant:'ghost'},'Cancelar'),
            h(Button,{variant:'danger'},'Excluir'),
          )},
        { label:'Com ícone, contador e tamanho', code:
`<Button variant="fill" icon="add">Novo aluno</Button>
<Button variant="outline" icon="download">Exportar</Button>
<Button variant="fill" counter={3}>Notificações</Button>
<Button variant="fill" size="sm">Compacto</Button>
<Button variant="fill" disabled>Desativado</Button>`,
          el: row(
            h(Button,{variant:'fill',icon:'add'},'Novo aluno'),
            h(Button,{variant:'outline',icon:'download'},'Exportar'),
            h(Button,{variant:'fill',counter:3},'Notificações'),
            h(Button,{variant:'fill',size:'sm'},'Compacto'),
            h(Button,{variant:'fill',disabled:true},'Desativado'),
          )},
      ];
      case 'iconButton': return [
        { label:'Variantes', code:
`<IconButton icon="edit" variant="ghost" />
<IconButton icon="edit" variant="fill" />
<IconButton icon="edit" variant="outline" />
<IconButton icon="menu" variant="ghost" active />`,
          el: row(
            h(IconButton,{icon:'edit',variant:'ghost'}),
            h(IconButton,{icon:'edit',variant:'fill'}),
            h(IconButton,{icon:'edit',variant:'outline'}),
            h(IconButton,{icon:'menu',variant:'ghost',active:true}),
          )},
        { label:'Tamanho quadrado (32px)', code:
`<IconButton icon="close" size={32} />`,
          el: row(
            h(IconButton,{icon:'close',size:32}),
            h(IconButton,{icon:'more_vert',size:32}),
            h(IconButton,{icon:'search',size:32,variant:'outline'}),
          )},
      ];
      case 'input': return [
        { label:'Estados', code:
`<Input label="Nome completo" placeholder="Digite o nome" />
<Input label="Buscar" icon="search" placeholder="Buscar aluno" />
<Input label="Data de nascimento" helpText="Formato DD/MM/AAAA" />
<Input label="E-mail" error="E-mail inválido" />`,
          el: col(16,
            h(Input,{label:'Nome completo',placeholder:'Digite o nome',value:d.inputs.a,onChange:v=>set({inputs:{...d.inputs,a:v}})}),
            h(Input,{label:'Buscar',icon:'search',placeholder:'Buscar aluno',value:d.inputs.b,onChange:v=>set({inputs:{...d.inputs,b:v}})}),
            h(Input,{label:'Data de nascimento',helpText:'Formato DD/MM/AAAA',value:d.inputs.c,onChange:v=>set({inputs:{...d.inputs,c:v}})}),
            h(Input,{label:'E-mail',error:'E-mail inválido',value:d.inputs.d,onChange:v=>set({inputs:{...d.inputs,d:v}})}),
          )},
      ];
      case 'tag': return [
        { label:'Cores semânticas', code:
`<Tag>Padrão</Tag>
<Tag color="#9D0364">Militar</Tag>
<Tag color="#774BB0">Bilíngue</Tag>
<Tag color="#28975A">Cursando</Tag>
<Tag color="#E65637">Pendente</Tag>
<Tag color="#FFAC30">Atenção</Tag>`,
          el: row(
            h(Tag,null,'Padrão'),
            h(Tag,{color:'#9D0364'},'Militar'),
            h(Tag,{color:'#774BB0'},'Bilíngue'),
            h(Tag,{color:'#28975A'},'Cursando'),
            h(Tag,{color:'#E65637'},'Pendente'),
            h(Tag,{color:'#FFAC30'},'Atenção'),
          )},
        { label:'Com ícone e tamanho pequeno', code:
`<Tag color="#9D0364" icon="school">1 ano A</Tag>
<Tag color="#242CC2" size="sm">Novo</Tag>`,
          el: row(
            h(Tag,{color:'#9D0364',icon:'school'},'1 ano A'),
            h(Tag,{color:'#242CC2',icon:'star',size:'sm'},'Novo'),
            h(Tag,{color:'#28975A',icon:'check',size:'sm'},'Ativo'),
          )},
      ];
      case 'avatar': {
        const SquareAvatar = ({ name, size=40, bg='#242CC2' }) => {
          const initials = name.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase();
          return h('div',{style:{width:size,height:size,borderRadius:8,background:bg,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Archivo',fontWeight:700,fontSize:size*0.4}},initials);
        };
        const BadgedAvatar = ({ name, size=40, count }) => h('div',{style:{position:'relative',display:'inline-flex'}},
          h(Avatar,{name,size}),
          count != null && h('span',{style:{position:'absolute',top:-4,right:-4,minWidth:20,height:20,borderRadius:999,background:'#9D0364',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Nunito',fontWeight:700,fontSize:11,padding:'0 4px',border:'2px solid #fff'}},count));
        return [
          { label:'Tamanhos', code:

          { label:'Estados', code:
`.card { border-radius: 8px; background: #fff; }
/* default */   border: 1px solid #EBEDF1; box-shadow: $shadow-down-medium;
/* hover */     box-shadow: $shadow-down-large;
/* focused */   border-color: #242CC2; box-shadow: 0 0 0 3px rgba(36,44,194,.24);
/* selected */  border-color: #242CC2; background: #ECEDFF;
/* disabled */  background: #F8F9FB; opacity: .6 (conteúdo);
/* dragged */   box-shadow: $shadow-down-xlarge; opacity: .9; rotate(-2deg);`,
            el: row(
              ...['default','hover','focused','selected','disabled','dragged'].map(s =>
                h('div',{key:s,style:{display:'flex',flexDirection:'column',gap:6,alignItems:'center',width:180}},
                  h('span',{style:{fontFamily:'Nunito',fontSize:11,color:'#8A8F98',textAlign:'center',textTransform:'capitalize'}},s),
                  BaseCard(s))),
            )},
        ];
      }
      case 'avatarCard': {
        const AvatarCard = ({ name, meta, stats, selected }) => h('div', { style:{
          width:320, background:'#fff', borderRadius:8, overflow:'hidden',
          border: selected ? '1px solid #242CC2' : '1px solid #EBEDF1',
          boxShadow: selected ? 'none' : '0 4px 12px -2px rgba(0,23,31,0.15)',
        } },
          h('div', { style:{ display:'flex', gap:12, padding:16, alignItems:'center', borderBottom:'1px solid #EBEDF1', background: selected ? '#ECEDFF' : 'transparent' } },
            h(Avatar,{name,size:44}),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{fontFamily:'Nunito',fontWeight:700,fontSize:15,color:'#0F0F10',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},name),
              h('div',{style:{fontFamily:'Nunito',fontSize:12,color:'#65686E',marginTop:2}},meta)),
            h('span',{className:'material-symbols-outlined',style:{color:'#65686E',fontSize:20}},'more_vert')),
          h('div', { style:{ display:'flex', gap:8, padding:16 } },
            stats.map(s => h('div',{key:s.k,style:{flex:1,background:'#F8F9FB',borderRadius:8,padding:'10px 12px'}},
              h('div',{style:{fontFamily:'Nunito',fontSize:12,color:'#65686E'}},s.k),
              h('div',{style:{fontFamily:'Archivo',fontWeight:700,fontSize:20,color:'#0F0F10'}},s.v)))),
        );
        return [
          { label:'Avatar, meta e estatísticas', code:
`<AvatarCard name="Wanderson Uchiha" meta="1 ano A — Militar"
  stats={[{ k:'Faltas', v:6 }, { k:'Atrasos', v:2 }, { k:'Média', v:'8,4' }]} />`,
            el: AvatarCard({ name:'Wanderson Uchiha', meta:'1 ano A — Militar', stats:[{k:'Faltas',v:6},{k:'Atrasos',v:2},{k:'Média',v:'8,4'}] }) },
          { label:'Estado selecionado', code:
`<AvatarCard selected name="Maria Silva" meta="1 ano A — Militar"
  stats={[{ k:'Faltas', v:3 }, { k:'Atrasos', v:2 }, { k:'Média', v:'9,2' }]} />`,
            el: AvatarCard({ name:'Maria Silva', meta:'1 ano A — Militar', selected:true, stats:[{k:'Faltas',v:3},{k:'Atrasos',v:2},{k:'Média',v:'9,2'}] }) },
        ];
      }
      case 'accordion': {
        const AccordionItem = ({ title, children, kind, open, onToggle }) => {
          const radius = {
            single: open ? '8px 8px 0 0' : '8px',
            top:    '8px 8px 0 0',
            middle: '0',
            bottom: open ? '0' : '0 0 8px 8px',
          }[kind];
          return h('div', { style:{ display:'flex', flexDirection:'column' } },
            h('button', { onClick:onToggle, style:{
              display:'flex', alignItems:'center', gap:24, padding:'16px 16px', height:56, boxSizing:'border-box',
              background: open ? '#ECEDFF' : '#fff', boxShadow:'0px 2px 8px 0px rgba(0,0,0,0.16)',
              border:0, cursor:'pointer', textAlign:'left', width:'100%', borderRadius:radius, position:'relative', zIndex:1,
            } },
              h('span',{style:{flex:1,fontFamily:'Archivo',fontWeight:700,fontSize:16,lineHeight:'16px',color:open?'#242CC2':'#0F0F10'}},title),
              h('span',{className:'material-symbols-outlined',style:{fontSize:24,color:open?'#242CC2':'#0F0F10',transform:open?'rotate(180deg)':'none',transition:'transform 240ms cubic-bezier(0.16,1,0.3,1)',display:'inline-block'}},'expand_more'),
            ),
            h('div', { style:{ overflow:'hidden', maxHeight: open?300:0, transition:'max-height 280ms cubic-bezier(0.16,1,0.3,1)', background:'#fff', boxShadow: open?'0px 4px 8px 0px rgba(0,0,0,0.10)':'none', borderRadius: (kind==='single'||kind==='bottom') ? '0 0 8px 8px' : 0 } },
              h('div', { style:{ padding:'16px 16px 20px', fontFamily:'Nunito', fontSize:16, lineHeight:'24px', color:'#3D3F42' } }, children)),
          );
        };
        return [
          { label:'Item único (single)', code:
`<Accordion type="single" title="Accordion text" open={open} onToggle={fn}>
  Conteúdo expandido do accordion.
</Accordion>`,
            el: h('div',{style:{width:'100%',maxWidth:520}},
              AccordionItem({ title:'Accordion text', kind:'single', open:d.accOpen1 ?? true, onToggle:()=>set({accOpen1: !(d.accOpen1 ?? true)}), children:'Conteúdo expandido do accordion. Quando o tipo é Single, este item possui raio em todos os cantos.' })) },
          { label:'Grupo (top · middle · bottom)', code:
`<AccordionGroup>
  <Accordion type="top" title="Primeiro item" .../>
  <Accordion type="middle" title="Segundo item" .../>
  <Accordion type="middle" title="Terceiro item" .../>
  <Accordion type="bottom" title="Último item" .../>
</AccordionGroup>`,
            el: h('div',{style:{width:'100%',maxWidth:520,display:'flex',flexDirection:'column'}},
              AccordionItem({ title:'Primeiro item (top)', kind:'top', open:d.accGroup==='a', onToggle:()=>set({accGroup: d.accGroup==='a'?null:'a'}), children:'Conteúdo do primeiro item do grupo.' }),
              AccordionItem({ title:'Segundo item (middle)', kind:'middle', open:d.accGroup==='b', onToggle:()=>set({accGroup: d.accGroup==='b'?null:'b'}), children:'Conteúdo do item do meio.' }),
              AccordionItem({ title:'Terceiro item (middle)', kind:'middle', open:d.accGroup==='c', onToggle:()=>set({accGroup: d.accGroup==='c'?null:'c'}), children:'Outro item do meio do grupo.' }),
              AccordionItem({ title:'Último item (bottom)', kind:'bottom', open:d.accGroup==='d', onToggle:()=>set({accGroup: d.accGroup==='d'?null:'d'}), children:'Conteúdo do último item do grupo.' }),
            )},
        ];
      }
      case 'modal': return [
        { label:'Janela sobreposta', code:
`<Modal open={open} onClose={fn} title="Editar aluno"
  actions={<><Button variant="ghost" size="sm">Cancelar</Button>
            <Button variant="fill" size="sm">Salvar</Button></>}>
  <Input label="Nome completo" … />
  <Input label="E-mail" icon="mail" … />
</Modal>`,
          el: row(
            h(Button,{variant:'fill',icon:'edit',onClick:()=>set({modal:true})},'Abrir modal'),
            h('span',{style:{fontFamily:'Nunito',fontSize:13,color:'#65686E'}},'Clique fora ou no X para fechar.'),
          )},
      ];
      case 'table': return [
        { label:'Tabela ordenável e selecionável', code:
`<Table selectable sortable
  columns={[
    { key:'nome', label:'Aluno' },
    { key:'turma', label:'Turma' },
    { key:'media', label:'Média', align:'right' },
    { key:'status', label:'Situação',
      render:(v) => <Tag color={cor[v]}>{v}</Tag> },
  ]}
  rows={rows} onRowClick={fn} />`,
          el: h('div',{style:{width:'100%'}},
            h(Table,{
              selectable:true, sortable:true,
              columns:[
                {key:'nome',label:'Aluno',render:(v)=>h('span',{style:{fontFamily:'Nunito',fontWeight:700,fontSize:14,color:'#0F0F10'}},v)},
                {key:'turma',label:'Turma'},
                {key:'media',label:'Média',align:'right'},
                {key:'status',label:'Situação',sortable:false,render:(v)=>h(Tag,{size:'sm',color:({'Cursando':'#28975A','Atenção':'#FFAC30','Pendente':'#E65637'})[v]},v)},
              ],
              rows:[
                {nome:'Wanderson Uchiha',turma:'1 ano A',media:8.4,status:'Atenção'},
                {nome:'Maria Silva',turma:'1 ano A',media:9.2,status:'Cursando'},
                {nome:'João Pereira',turma:'1 ano B',media:5.1,status:'Pendente'},
                {nome:'Ana Costa',turma:'2 ano A',media:7.8,status:'Cursando'},
              ],
              onRowClick:()=>{},
            })) },
      ];
      case 'studentCard': return [
        { label:'Composição completa', code:
`<StudentCard student={student}
  onBack={fn} onEdit={() => setModal(true)} />`,
          el: h('div',{style:{width:'100%',overflowX:'auto',margin:'-32px',alignSelf:'stretch'}},
            h('div',{style:{minWidth:1120}}, h(StudentCard,{student:STUDENT,onBack:()=>{},onEdit:()=>set({modal:true})}))) },
      ];
      default: return [];
    }
  }

  renderVals() {
    const W = window;
    const ready = !!W.Button;
    const sel = this.state.selected || this.props.startComponent || 'button';
    const d = this.state.demo;
    const set = (patch) => this.setState(s => ({ demo: { ...s.demo, ...patch } }));

    const groups = CATALOG.map(g => ({
      label: g.label,
      items: g.items.map(it => {
        const active = it.id === sel;
        return {
          id: it.id, name: it.name, icon: it.icon,
          onSelect: () => this.setState({ selected: it.id }),
          style: {
            display:'flex', alignItems:'center', gap:12, width:'100%',
            padding:'9px 12px', margin:'2px 0', border:0, borderRadius:8,
            fontFamily:"'Nunito',sans-serif", fontSize:14, textAlign:'left', cursor:'pointer',
            background: active ? '#E3E5FB' : 'transparent',
            color: active ? '#242CC2' : '#3D3F42',
            fontWeight: active ? 700 : 500,
            transition: 'background 120ms',
          },
        };
      }),
    }));

    const current = FLAT.find(c => c.id === sel) || FLAT[0];
    const examples = ready ? this.build(sel, d, set, W) : [];

    const overlays = ready ? h(R.Fragment, null,
      h(W.Modal, {
        open: d.modal, onClose: () => set({ modal:false }), title: 'Editar aluno',
        actions: h(R.Fragment, null,
          h(W.Button, { variant:'ghost', size:'sm', onClick:()=>set({modal:false}) }, 'Cancelar'),
          h(W.Button, { variant:'fill', size:'sm', onClick:()=>set({modal:false, toast:true}) }, 'Salvar')),
      },
        h('div', { style:{ display:'flex', flexDirection:'column', gap:16 } },
          h(W.Input, { label:'Nome completo', value:d.modalName, onChange:v=>set({modalName:v}) }),
          h(W.Input, { label:'E-mail', icon:'mail', value:d.modalEmail, onChange:v=>set({modalEmail:v}) }))),
      d.toast ? h(W.Toast, { title:'Alterações salvas com sucesso', duration:4000, onClose:()=>set({toast:false}) }) : null,
    ) : null;

    return {
      groups, current, examples, overlays,
      notReady: !ready,
      showCode: this.props.showCode ?? true,
    };
  }

  componentDidMount() {
    if (!window.Button) {
      this._iv = setInterval(() => {
        if (window.Button) { clearInterval(this._iv); this.forceUpdate(); }
      }, 60);
    }
  }
  componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
}
</script>
</body>
</html>
