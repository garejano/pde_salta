<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estados vazios — Dias letivos extras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --color-primary-dark1:#191F88; --color-primary:#242CC2; --color-primary-light3:#ECEDFF;
    --color-secondary:#9D0364;
    --color-inform:#774BB0; --color-inform-light2:#F5EDFF;
    --color-tertiary:#30B7BE; --eleva-green:#39D881;
    --color-neutral-dark3:#0F0F10; --color-neutral-dark2:#3D3F42; --color-neutral-dark1:#65686E;
    --color-neutral:#ADB2BA; --color-neutral-light1:#C3C8D1; --color-neutral-light2:#EBEDF1;
    --color-neutral-light3:#F8F9FB; --bg-inset:#F2F2F2; --white:#FFFFFF;
    --font-display:"Archivo","Inter",system-ui,sans-serif;
    --font-body:"Nunito","Inter",system-ui,sans-serif;
    --shadow-down-medium:0 4px 8px 0 rgba(0,23,31,0.15);
    --ease-out:cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family:var(--font-body); color:var(--color-neutral-dark3);
    background:var(--bg-inset);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .ms { font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal;
        line-height:1; letter-spacing:normal; text-transform:none; white-space:nowrap;
        word-wrap:normal; direction:ltr; display:inline-block;
        font-feature-settings:'liga'; -webkit-font-feature-settings:'liga';
        font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
        -webkit-font-smoothing:antialiased; }
  @keyframes floaty { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  @media (prefers-reduced-motion: reduce){ .floaty { animation:none !important; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const Icon = ({ name, size=20, color='currentColor', fill=0, style={} }) => (
  <span className="ms" style={{ fontSize:size, color,
    fontVariationSettings:`'FILL' ${fill}, 'opsz' 24`, ...style }}>{name}</span>
);

const COLUMNS = [
  { key:'data',   label:'Data',   width:200 },
  { key:'escola', label:'Escola', width:170 },
  { key:'titulo', label:'Título', width:'auto' },
  { key:'turmas', label:'Turmas', width:360 },
  { key:'acao',   label:'',       width:170, align:'right' },
];

const btnBase = {
  display:'inline-flex', alignItems:'center', gap:8, cursor:'pointer',
  fontFamily:'var(--font-display)', fontWeight:700, fontSize:14, lineHeight:'14px',
  padding:'12px 18px', borderRadius:8, border:'1px solid transparent',
  transition:'background 160ms var(--ease-out), color 160ms var(--ease-out)',
};

function TableHead() {
  return (
    <thead>
      <tr style={{ background:'var(--color-neutral-light1)' }}>
        {COLUMNS.map(c => (
          <th key={c.key} style={{
            padding:'12px 24px', textAlign:c.align||'left',
            fontFamily:'var(--font-body)', fontWeight:700, fontSize:14, color:'var(--color-neutral-dark2)',
            whiteSpace:'nowrap', width:c.width,
          }}>{c.label}</th>
        ))}
      </tr>
    </thead>
  );
}

/* ---------- Empty state body ---------- */
function EmptyBody({ children }) {
  return (
    <tbody>
      <tr>
        <td colSpan={COLUMNS.length} style={{ padding:'56px 24px 64px' }}>
          <div style={{ maxWidth:440, margin:'0 auto', display:'flex', flexDirection:'column',
            alignItems:'center', textAlign:'center' }}>
            {children}
          </div>
        </td>
      </tr>
    </tbody>
  );
}

const titleStyle = { margin:0, fontFamily:'var(--font-display)', fontWeight:600, fontSize:20,
  color:'var(--color-neutral-dark3)' };
const textStyle  = { margin:'8px 0 0', fontFamily:'var(--font-body)', fontSize:15, lineHeight:'24px',
  color:'var(--color-neutral-dark1)' };

/* Variants — versão profissional ------------------------------------- */

// filtro não aplicado
function NoFilterPro() {
  return (
    <EmptyBody>
      <Icon name="filter_alt" size={36} color="var(--color-neutral)" style={{ marginBottom:16 }} />
      <h3 style={titleStyle}>Nenhum filtro aplicado</h3>
      <p style={textStyle}>Aplique um filtro de ano letivo e rede para listar os dias letivos extras.</p>
    </EmptyBody>
  );
}

// sem resultados
function NoResultsPro() {
  return (
    <EmptyBody>
      <Icon name="search_off" size={36} color="var(--color-neutral)" style={{ marginBottom:16 }} />
      <h3 style={titleStyle}>Nenhum dia letivo extra encontrado</h3>
      <p style={textStyle}>Revise os filtros aplicados e tente novamente.</p>
    </EmptyBody>
  );
}

/* ---------- Card frame ---------- */
function Card({ children }) {
  return (
    <div style={{ flex:'1 1 100%', minWidth:0 }}>
      <div style={{ background:'#fff', borderRadius:8, border:'1px solid var(--color-neutral-light2)',
        overflow:'hidden', boxShadow:'var(--shadow-down-medium)' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', tableLayout:'fixed' }}>
          <TableHead />
          {children}
        </table>
      </div>
    </div>
  );
}

function Section({ title, sub, children }) {
  return (
    <section style={{ marginBottom:48 }}>
      <h2 style={{ margin:'0 0 4px', fontFamily:'var(--font-display)', fontWeight:700, fontSize:22,
        color:'var(--color-neutral-dark3)' }}>{title}</h2>
      <p style={{ margin:'0 0 24px', fontFamily:'var(--font-body)', fontSize:15, color:'var(--color-neutral-dark1)' }}>{sub}</p>
      <div style={{ display:'flex', flexWrap:'wrap', gap:32 }}>{children}</div>
    </section>
  );
}

function App() {
  return (
    <div style={{ padding:'48px clamp(24px,5vw,64px) 72px', maxWidth:1320, margin:'0 auto' }}>
      <header style={{ marginBottom:40 }}>
        <p style={{ margin:'0 0 6px', fontFamily:'var(--font-display)', fontWeight:700, fontSize:13,
          letterSpacing:'.06em', color:'var(--color-secondary)' }}>DIAS LETIVOS EXTRAS</p>
        <h1 style={{ margin:0, fontFamily:'var(--font-display)', fontWeight:700, fontSize:32,
          color:'var(--color-neutral-dark3)' }}>Estados vazios da tabela</h1>
        <p style={{ margin:'8px 0 0', fontFamily:'var(--font-body)', fontSize:16, color:'var(--color-neutral-dark1)' }}>
          Versão profissional e enxuta para cada cenário.
        </p>
      </header>

      <Section title="Filtro não aplicado"
        sub="Estado inicial — sem loading e sem dados. O usuário ainda não escolheu os filtros.">
        <Card><NoFilterPro /></Card>
      </Section>

      <Section title="Filtro aplicado · sem resultados"
        sub="O filtro foi aplicado, mas a busca não retornou nenhum dia letivo extra.">
        <Card><NoResultsPro /></Card>
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
