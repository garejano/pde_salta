<!doctype html>
<!-- @dsCard group="Components" name="Loading" subtitle="Spinner, skeleton, overlay, botão carregando" viewport="700x480" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family:'Nunito',sans-serif; display:flex; flex-direction:column; gap:28px; }
  .label { font-family:'Archivo'; font-weight:700; font-size:11px; color:#65686E; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }

  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── Spinner base ── */
  .spinner {
    border-radius:50%;
    border-style:solid;
    border-color:#C3C8D1;
    border-top-color:#242CC2;
    animation:spin 0.72s linear infinite;
    flex-shrink:0;
  }
  .spinner.big   { width:32px; height:32px; border-width:6px; }
  .spinner.small { width:16px; height:16px; border-width:4px; }

  /* ── Sizes demo ── */
  .sizes-row { display:flex; align-items:center; gap:40px; }
  .size-col  { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .size-label { font-family:'Inter'; font-size:11px; color:#65686E; font-weight:500; }

  /* ── In context ── */
  .context-row { display:flex; gap:16px; flex-wrap:wrap; }

  /* Button with spinner */
  .btn-loading {
    display:inline-flex; align-items:center; gap:8px;
    padding:0 16px; height:40px; border-radius:8px; border:0;
    background:#242CC2; color:#fff;
    font-family:'Archivo'; font-weight:700; font-size:14px; cursor:not-allowed;
  }
  .btn-loading .spinner.small { border-color:rgba(255,255,255,0.32); border-top-color:#fff; }

  /* Card loading state */
  .card-loading {
    border:1px solid #EBEDF1; border-radius:8px; padding:32px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    flex-direction:column; min-width:200px;
    background:#fff;
  }
  .card-loading span { font-family:'Nunito'; font-size:14px; color:#65686E; }

  /* Table row shimmer */
  .shimmer-wrap { border:1px solid #EBEDF1; border-radius:8px; overflow:hidden; }
  .shimmer-row { display:grid; grid-template-columns:2fr 2fr 1fr 1fr; gap:16px; padding:12px 16px; border-bottom:1px solid #EBEDF1; }
  .shimmer-row:last-child { border-bottom:0; }
  @keyframes shimmer {
    0%   { background-position:-400px 0; }
    100% { background-position:400px 0; }
  }
  .shimmer-block {
    height:14px; border-radius:4px;
    background:linear-gradient(90deg,#EBEDF1 25%,#F8F9FB 50%,#EBEDF1 75%);
    background-size:800px 100%;
    animation:shimmer 1.4s infinite;
  }
  .shimmer-block.short { width:60%; }
  .shimmer-block.xs    { width:40%; }

  /* Full overlay */
  .overlay-demo {
    position:relative; border:1px solid #EBEDF1; border-radius:8px;
    overflow:hidden; height:120px;
  }
  .overlay-content { padding:24px; font-family:'Nunito'; font-size:14px; color:#3D3F42; }
  .loading-overlay {
    position:absolute; inset:0; background:rgba(255,255,255,0.80);
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'Nunito'; font-size:14px; color:#242CC2; font-weight:700;
  }

  /* Color variants row */
  .variants-row { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  .variant-item { display:flex; align-items:center; gap:8px; font-family:'Nunito'; font-size:13px; color:#3D3F42; }
  .dark-bg { background:#0F0F10; border-radius:8px; padding:12px 16px; display:flex; align-items:center; gap:8px; }
  .dark-bg span { font-family:'Nunito'; font-size:13px; color:#fff; }
</style>
</head>
<body>

<!-- Sizes -->
<div>
  <div class="label">Tamanhos</div>
  <div class="sizes-row">
    <div class="size-col">
      <div class="spinner big"></div>
      <span class="size-label">Grande · 48px</span>
    </div>
    <div class="size-col">
      <div class="spinner small"></div>
      <span class="size-label">Pequeno · 24px</span>
    </div>
  </div>
</div>

<!-- Color variants -->
<div>
  <div class="label">Variantes de cor</div>
  <div class="variants-row">
    <div class="variant-item">
      <div class="spinner big"></div>
      <span>Primary</span>
    </div>
    <div class="variant-item">
      <div class="spinner big" style="border-top-color:#9D0364;"></div>
      <span>Secondary</span>
    </div>
    <div class="variant-item">
      <div class="spinner big" style="border-top-color:#30B7BE;"></div>
      <span>Tertiary</span>
    </div>
    <div class="dark-bg">
      <div class="spinner big" style="border-color:rgba(255,255,255,0.24);border-top-color:#fff;"></div>
      <span>Em fundo escuro</span>
    </div>
  </div>
</div>

<!-- In context -->
<div>
  <div class="label">Em contexto</div>
  <div class="context-row">

    <!-- Loading button -->
    <div>
      <div style="font-family:'Inter';font-size:11px;color:#65686E;margin-bottom:6px;">Botão carregando</div>
      <button class="btn-loading">
        <div class="spinner small"></div>
        Salvando...
      </button>
    </div>

    <!-- Card loading -->
    <div class="card-loading">
      <div class="spinner big"></div>
      <span>Carregando dados...</span>
    </div>

  </div>
</div>

<!-- Shimmer / skeleton -->
<div>
  <div class="label">Skeleton (tabela)</div>
  <div class="shimmer-wrap">
    <div class="shimmer-row" style="background:#F8F9FB;border-bottom:1px solid #EBEDF1;">
      <div class="shimmer-block" style="height:12px;width:70%;background:#EBEDF1;animation:none;"></div>
      <div class="shimmer-block" style="height:12px;width:70%;background:#EBEDF1;animation:none;"></div>
      <div class="shimmer-block" style="height:12px;width:50%;background:#EBEDF1;animation:none;"></div>
      <div class="shimmer-block" style="height:12px;width:40%;background:#EBEDF1;animation:none;"></div>
    </div>
    <div class="shimmer-row"><div class="shimmer-block"></div><div class="shimmer-block short"></div><div class="shimmer-block xs"></div><div class="shimmer-block xs"></div></div>
    <div class="shimmer-row"><div class="shimmer-block short"></div><div class="shimmer-block"></div><div class="shimmer-block xs"></div><div class="shimmer-block short"></div></div>
    <div class="shimmer-row"><div class="shimmer-block"></div><div class="shimmer-block xs"></div><div class="shimmer-block short"></div><div class="shimmer-block xs"></div></div>
    <div class="shimmer-row"><div class="shimmer-block short"></div><div class="shimmer-block"></div><div class="shimmer-block xs"></div><div class="shimmer-block short"></div></div>
  </div>
</div>

<!-- Overlay -->
<div>
  <div class="label">Overlay de carregamento</div>
  <div class="overlay-demo">
    <div class="overlay-content">
      Conteúdo da página que está sendo atualizado...
    </div>
    <div class="loading-overlay">
      <div class="spinner big"></div>
      Atualizando...
    </div>
  </div>
</div>

</body></html>
