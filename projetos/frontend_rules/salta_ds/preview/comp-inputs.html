<!doctype html>
<!-- @dsCard group="Components" name="Inputs" subtitle="Default, focus, error" viewport="700x340" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  body { margin:0; padding:20px; background:#fff; font-family:'Nunito'; display:flex; flex-direction:column; gap:14px; }
  .field { display:flex; flex-direction:column; gap:6px; max-width:340px; }
  label { font-family:'Inter'; font-weight:500; font-size:12px; color:#0F0F10; }
  .input { display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:8px; border:1px solid #C3C8D1; height:40px; background:#fff; }
  .input.focus { border-color:#242CC2; box-shadow:0 0 0 3px rgba(36,44,194,0.24); }
  .input.error { border-color:#E65637; }
  .input input { border:0; outline:0; font-family:'Nunito'; font-size:16px; flex:1; color:#0F0F10; background:transparent; }
  .input .material-symbols-outlined { color:#65686E; font-size:22px; }
  .help { font-family:'Nunito'; font-size:12px; color:#65686E; }
  .help.err { color:#E65637; }
</style></head><body>
<div class="field">
  <label>E-mail</label>
  <div class="input"><span class="material-symbols-outlined">mail</span><input placeholder="aluno@gruposalta.com.br"></div>
  <span class="help">Utilizado para entrar no portal.</span>
</div>
<div class="field">
  <label>Nome completo</label>
  <div class="input focus"><span class="material-symbols-outlined">person</span><input value="Maria Silva"></div>
</div>
<div class="field">
  <label>CPF</label>
  <div class="input error"><span class="material-symbols-outlined">badge</span><input value="000.000.000-00"></div>
  <span class="help err">CPF inválido.</span>
</div>
</body></html>
