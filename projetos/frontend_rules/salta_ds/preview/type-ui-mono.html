<!doctype html>

<html><head><meta charset="utf-8">

  body { margin: 0; padding: 20px; background: #fff; font-family: 'Inter'; }

<div class="row"><span class="label">Button (Archivo 16/Bold)</span><span class="uibtn">Button primary</span></div>

<div class="row"><span class="label">Mono (Inconsolata 16)</span><span class="uicode">#242CC2</span></div>
