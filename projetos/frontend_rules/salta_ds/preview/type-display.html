<!doctype html>
<!-- @dsCard group="Type" name="Display type" subtitle="Archivo — headings" viewport="700x280" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Nunito', sans-serif; color: #0F0F10; }
  .grid { display: grid; grid-template-columns: 120px 1fr 180px; gap: 4px 16px; align-items: baseline; }
  .token { font-family: 'Inconsolata', monospace; font-size: 12px; color: #65686E; }
  .spec  { font-family: 'Inconsolata', monospace; font-size: 11px; color: #65686E; text-align: right; }
  .sample{ color: #0F0F10; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .archivo { font-family: 'Archivo', sans-serif; }
  .nunito  { font-family: 'Nunito', sans-serif; }
</style></head>
<body>
<div class="grid">
  <div class="token">$font-display1</div>
  <div class="sample archivo" style="font-size:56px;line-height:64px;font-weight:600;">Aa 123</div>
  <div class="spec">Archivo SemiBold · 56/64</div>

  <div class="token">$font-display2</div>
  <div class="sample archivo" style="font-size:48px;line-height:60px;font-weight:600;">Aa 123</div>
  <div class="spec">Archivo SemiBold · 48/60</div>

  <div class="token">$font-title1</div>
  <div class="sample archivo" style="font-size:40px;line-height:56px;font-weight:600;">Aa 123</div>
  <div class="spec">Archivo SemiBold · 40/56</div>

  <div class="token">$font-title2</div>
  <div class="sample archivo" style="font-size:32px;line-height:48px;font-weight:600;">Aa 123</div>
  <div class="spec">Archivo SemiBold · 32/48</div>

  <div class="token">$font-title3</div>
  <div class="sample archivo" style="font-size:24px;line-height:32px;font-weight:600;">Aa 123</div>
  <div class="spec">Archivo SemiBold · 24/32</div>

  <div class="token">$font-title4</div>
  <div class="sample archivo" style="font-size:18px;line-height:22px;font-weight:600;">Aa 123</div>
  <div class="spec">Archivo SemiBold · 18/22</div>
</div>
</body></html>
