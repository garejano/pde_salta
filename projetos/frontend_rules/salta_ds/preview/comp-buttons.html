<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Fill / outline / ghost / disabled" viewport="700x110" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  body { margin:0; padding:20px; background:#fff; font-family:'Nunito'; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .btn { font-family:'Archivo'; font-weight:700; font-size:16px; line-height:1; padding:12px 16px; border-radius:8px; display:inline-flex; align-items:center; gap:8px; border:1px solid transparent; cursor:pointer; }
  .fill { background:#242CC2; color:#fff; }
  .fill:hover { background:#1E258F; }
  .outline { background:#fff; color:#242CC2; border-color:#242CC2; }
  .ghost { background:transparent; color:#242CC2; }
  .disabled { background:#EBEDF1; color:#ADB2BA; cursor:not-allowed; }
  .material-symbols-outlined { font-size:20px; }
  .counter { width:24px; height:24px; border-radius:999px; background:#fff; color:#9D0364; display:inline-flex; align-items:center; justify-content:center; font-family:'Nunito'; font-weight:700; font-size:14px; }
</style></head><body>
<div class="row">
  <button class="btn fill"><span class="material-symbols-outlined">star</span>Button<span class="counter">3</span></button>
  <button class="btn outline"><span class="material-symbols-outlined">edit</span>Editar</button>
  <button class="btn ghost">Cancelar</button>
  <button class="btn disabled">Desativado</button>
</div>
</body></html>
