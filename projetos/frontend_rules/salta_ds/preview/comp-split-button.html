<!-- @dsCard group="Components" name="Split Button" subtitle="Ação principal + dropdown · Enable, Hover, Selected, Disabled" viewport="700x380" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
<style>
  body { margin:0; padding:24px; background:#fff; font-family:'Nunito',sans-serif; display:flex; flex-direction:column; gap:28px; }
  .section-label { font-family:'Archivo'; font-weight:700; font-size:11px; color:#65686E; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }

  /* ── Split button shell ── */
  .split-btn { display:inline-flex; align-items:stretch; gap:1px; }

  /* ── Main part ── */
  .split-main {
    display:flex; align-items:center; gap:8px;
    padding:8px 16px; height:40px; box-sizing:border-box;
    border-radius:8px 0 0 8px; border:0;
    background:#EBEDF1; color:#242CC2;
    font-family:'Archivo'; font-weight:700; font-size:16px; line-height:16px;
    cursor:pointer; transition:background 120ms;
    white-space:nowrap;
  }
  .split-main:hover { background:#C3C8D1; }
  .split-main .material-symbols-outlined { font-size:20px; color:inherit; }

  /* ── Chevron part ── */
  .split-chevron {
    display:flex; align-items:center; justify-content:center;
    width:32px; height:40px; box-sizing:border-box;
    border-radius:0 8px 8px 0; border:0;
    background:#EBEDF1; color:#242CC2;
    cursor:pointer; transition:background 120ms;
    position:relative;
  }
  .split-chevron:hover { background:#C3C8D1; }
  .split-chevron .material-symbols-outlined { font-size:20px; color:inherit; }

  /* ── Selected/active state ── */
  .split-btn.selected .split-main,
  .split-btn.selected .split-chevron { background:#ECEDFF; }
  .split-btn.selected .split-main { font-weight:700; }

  /* ── Disabled ── */
  .split-btn.disabled .split-main,
  .split-btn.disabled .split-chevron { opacity:.4; cursor:not-allowed; pointer-events:none; }

  /* ── Checkbox inside ── */
  .cb {
    width:16px; height:16px; border-radius:3px; border:2px solid #242CC2;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:#fff;
  }
  .cb.checked { background:#242CC2; }
  .cb.checked::after { content:''; width:8px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px); }

  /* ── Dropdown menu ── */
  .dropdown-host { position:relative; }
  .dropdown-menu {
    position:absolute; top:calc(100% + 4px); right:0;
    min-width:180px; background:#F8F9FB;
    border-radius:8px; box-shadow:0 0 12px rgba(0,23,31,0.20);
    padding:12px; display:none; flex-direction:column; gap:4px; z-index:100;
  }
  .dropdown-menu.open { display:flex; }
  .dropdown-item {
    padding:8px 12px; border-radius:6px; font-family:'Nunito'; font-size:14px; color:#0F0F10;
    cursor:pointer; transition:background 120ms;
  }
  .dropdown-item:hover { background:#EBEDF1; }

  /* ── States grid ── */
  .states-row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end; }
  .state-col  { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .state-name { font-family:'Inter'; font-size:11px; color:#ADB2BA; }
</style>
</head>
<body>

<!-- Padrão interativo -->
<div>
  <div class="section-label">Demo interativo</div>
  <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;">

    <!-- Com ícone + texto + checkbox -->
    <div class="dropdown-host">
      <div class="split-btn" id="sb1">
        <button class="split-main" onclick="toggleCheck('sb1')">
          <span class="material-symbols-outlined">grid_on</span>
          Botão
          <div class="cb" id="cb1"></div>
        </button>
        <button class="split-chevron" onclick="toggleMenu('menu1')">
          <span class="material-symbols-outlined">expand_more</span>
        </button>
      </div>
      <div class="dropdown-menu" id="menu1">
        <div class="dropdown-item" onclick="closeMenu('menu1')">Opção 1</div>
        <div class="dropdown-item" onclick="closeMenu('menu1')">Opção 2</div>
        <div class="dropdown-item" onclick="closeMenu('menu1')">Opção 3</div>
      </div>
    </div>

    <!-- Somente texto -->
    <div class="dropdown-host">
      <div class="split-btn" id="sb2">
        <button class="split-main">
          Ação principal
        </button>
        <button class="split-chevron" onclick="toggleMenu('menu2')">
          <span class="material-symbols-outlined">expand_more</span>
        </button>
      </div>
      <div class="dropdown-menu" id="menu2">
        <div class="dropdown-item" onclick="closeMenu('menu2')">Exportar PDF</div>
        <div class="dropdown-item" onclick="closeMenu('menu2')">Exportar Excel</div>
        <div class="dropdown-item" onclick="closeMenu('menu2')">Imprimir</div>
      </div>
    </div>

  </div>
</div>

<!-- Estados -->
<div>
  <div class="section-label">Estados</div>
  <div class="states-row">

    <div class="state-col">
      <div class="split-btn">
        <button class="split-main"><span class="material-symbols-outlined">grid_on</span>Botão<div class="cb"></div></button>
        <button class="split-chevron"><span class="material-symbols-outlined">expand_more</span></button>
      </div>
      <span class="state-name">Enable</span>
    </div>

    <div class="state-col">
      <div class="split-btn" style="filter:brightness(0.93);">
        <button class="split-main" style="background:#C3C8D1;pointer-events:none;"><span class="material-symbols-outlined">grid_on</span>Botão<div class="cb"></div></button>
        <button class="split-chevron" style="background:#C3C8D1;pointer-events:none;"><span class="material-symbols-outlined">expand_more</span></button>
      </div>
      <span class="state-name">Hover</span>
    </div>

    <div class="state-col">
      <div class="split-btn selected">
        <button class="split-main"><span class="material-symbols-outlined">grid_on</span>Botão<div class="cb checked"></div></button>
        <button class="split-chevron"><span class="material-symbols-outlined">expand_more</span></button>
      </div>
      <span class="state-name">Selected</span>
    </div>

    <div class="state-col">
      <div class="split-btn" style="box-shadow:0 0 0 2px #0F0F10;border-radius:8px;">
        <button class="split-main" style="background:#EBEDF1;pointer-events:none;"><span class="material-symbols-outlined">grid_on</span>Botão<div class="cb"></div></button>
        <button class="split-chevron" style="background:#EBEDF1;pointer-events:none;"><span class="material-symbols-outlined">expand_more</span></button>
      </div>
      <span class="state-name">Focus</span>
    </div>

    <div class="state-col">
      <div class="split-btn disabled">
        <button class="split-main"><span class="material-symbols-outlined">grid_on</span>Botão<div class="cb"></div></button>
        <button class="split-chevron"><span class="material-symbols-outlined">expand_more</span></button>
      </div>
      <span class="state-name">Disabled</span>
    </div>

  </div>
</div>

<script>
  function toggleCheck(id) {
    const cb = document.querySelector('#' + id + ' .cb');
    cb.classList.toggle('checked');
    document.getElementById(id).classList.toggle('selected', cb.classList.contains('checked'));
  }
  function toggleMenu(id) {
    document.querySelectorAll('.dropdown-menu').forEach(m => { if(m.id !== id) m.classList.remove('open'); });
    document.getElementById(id).classList.toggle('open');
  }
  function closeMenu(id) { document.getElementById(id).classList.remove('open'); }
  document.addEventListener('click', e => {
    if(!e.target.closest('.dropdown-host')) document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
  });
</script>
</body></html>
