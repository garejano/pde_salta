<!doctype html>
<!-- @dsCard group="Type" name="Type · Button scale" subtitle="$font-button1/2/3" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Nunito', sans-serif; color: #0F0F10; }
  .grid { display: grid; grid-template-columns: 120px 1fr 110px; gap: 6px 16px; align-items: center; }
  .token { font-family: 'Inconsolata', monospace; font-size: 12px; color: #65686E; }
  .spec { font-family: 'Inconsolata', monospace; font-size: 11px; color: #65686E; text-align: right; }
  .btn { display: inline-block; background:#242CC2; color:#fff; border-radius: 8px; padding: 10px 16px; font-family: 'Archivo', sans-serif; }
</style></head>
<body>
<div class="grid">
  <div class="token">$font-button1</div>
  <div><span class="btn" style="font-size:16px;line-height:16px;font-weight:700;padding:14px 20px;">Confirmar ação</span></div>
  <div class="spec">Archivo Bold · 16/16</div>

  <div class="token">$font-button2</div>
  <div><span class="btn" style="font-size:14px;line-height:14px;font-weight:700;padding:12px 16px;">Salvar alteração</span></div>
  <div class="spec">Archivo Bold · 14/14</div>

  <div class="token">$font-button3</div>
  <div><span class="btn" style="font-size:14px;line-height:14px;font-weight:400;padding:12px 16px;background:#EBEDF1;color:#0F0F10;">Cancelar</span></div>
  <div class="spec">Archivo 14/14</div>
</div>
</body></html>
