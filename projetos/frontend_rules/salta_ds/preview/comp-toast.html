<!doctype html>
<!-- @dsCard group="Components" name="Toast" subtitle="With time-bar" viewport="700x180" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  body { margin:0; padding:20px; background:#F8F9FB; font-family:'Nunito'; }
  .toast { width:328px; background:#fff; border-radius:8px; box-shadow:0 4px 12px -2px rgba(0,23,31,.15); overflow:hidden; display:flex; flex-direction:column; }
  .body { display:flex; gap:8px; padding:24px 16px 16px; }
  .body .material-symbols-outlined { font-size:32px; color:#28975A; }
  .body p { flex:1; margin:0; font-family:'Inter'; font-size:18px; color:#0F0F10; line-height:1.35; }
  .x { font-size:24px; color:#65686E; cursor:pointer; }
  .bar { height:8px; background:#EBEDF1; }
  .bar .fill { height:100%; width:62%; background:#242CC2; }
</style></head><body>
<div class="toast">
  <div class="body">
    <span class="material-symbols-outlined">sentiment_very_satisfied</span>
    <p>Link enviado para o responsável.</p>
    <span class="material-symbols-outlined x">close</span>
  </div>
  <div class="bar"><div class="fill"></div></div>
</div>
</body></html>
