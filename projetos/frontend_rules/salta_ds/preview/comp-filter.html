<!doctype html>
<!-- @dsCard group="Components" name="Filter" subtitle="Busca + painel de filtros com selects" viewport="700x300" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
<style>
  body { margin:0; padding:20px; background:#fff; font-family:'Nunito',sans-serif; display:flex; flex-direction:column; gap:12px; }
  .search-row { display:flex; gap:8px; align-items:center; }
  .search { display:flex; align-items:center; gap:8px; padding:0 12px; height:40px; border:1px solid #C3C8D1; border-radius:8px; background:#fff; flex:1; max-width:360px; }
  .search input { border:0; outline:0; font-family:'Nunito'; font-size:14px; flex:1; background:transparent; color:#0F0F10; }
  .search .material-symbols-outlined { font-size:18px; color:#65686E; }
  .filter-btn { display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; border:0; background:#9D0364; color:#fff; font-family:'Archivo'; font-weight:700; font-size:13px; cursor:pointer; transition: background 120ms ease; }
  .filter-btn:hover  { background:#6E0246; }
  .filter-btn:active { background:#4D012F; }
  .filter-btn .badge { background:#fff; color:#9D0364; border-radius:999px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:'Archivo'; }

  .filter-panel { border:1px solid #EBEDF1; border-radius:8px; padding:20px 24px; background:#fff; }
  .filter-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  .sel { display:flex; flex-direction:column; gap:4px; }
  .sel label { font-family:'Inter'; font-weight:500; font-size:12px; color:#0F0F10; }
  .sel select { height:40px; padding:0 12px; border-radius:8px; border:1px solid #C3C8D1; font-family:'Nunito'; font-size:14px; color:#0F0F10; background:#fff; appearance:none; cursor:pointer; }
  .filter-foot { display:flex; justify-content:flex-end; gap:8px; padding-top:12px; border-top:1px solid #EBEDF1; }
  .btn-ghost { background:transparent; border:0; color:#9D0364; font-family:'Archivo'; font-weight:700; font-size:14px; padding:8px 14px; cursor:pointer; border-radius:8px; transition: background 120ms ease; }
  .btn-ghost:hover  { background:#F5E6EF; }
  .btn-ghost:active { background:#EACDE0; }
  .btn-fill  { background:#9D0364; border:0; color:#fff; font-family:'Archivo'; font-weight:700; font-size:14px; padding:8px 16px; cursor:pointer; border-radius:8px; transition: background 120ms ease; }
  .btn-fill:hover  { background:#6E0246; }
  .btn-fill:active { background:#4D012F; }
</style></head>
<body>

<div class="search-row">
  <div class="search">
    <span class="material-symbols-outlined">search</span>
    <input placeholder="Buscar alunos, turmas...">
  </div>
  <button class="filter-btn">
    <span class="material-symbols-outlined" style="font-size:18px">filter_alt</span>
    Filtro
    <span class="badge">2</span>
  </button>
</div>

<div class="filter-panel">
  <div class="filter-grid">
    <div class="sel"><label>Série</label><select><option>1 ano</option><option>2 ano</option><option>3 ano</option></select></div>
    <div class="sel"><label>Turma</label><select><option>Turma A</option><option>Turma B</option></select></div>
    <div class="sel"><label>Trilha</label><select><option>Militar</option><option>Regular</option><option>Bilíngue</option></select></div>
  </div>
  <div class="filter-foot">
    <button class="btn-ghost">Limpar filtros</button>
    <button class="btn-fill">Aplicar</button>
  </div>
</div>

</body></html>
