<!doctype html>
<!-- @dsCard group="Colors" name="Secondary color scale" subtitle="$color-secondary (magenta) · dark1 → light2" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .swatch { flex: 1; min-height: 96px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; font-family: 'Nunito', sans-serif; }
  .swatch .name { font-weight: 700; font-family: 'Archivo'; font-size: 11px; line-height: 1.1; }
  .swatch .hex  { font-family: 'Inconsolata', monospace; font-size: 11px; opacity: .85; }
  .swatch .token{ font-family: 'Inconsolata', monospace; font-size: 10px; opacity: .7; }
  .l { color: #0F0F10; }
  .d { color: #fff; }
</style></head>
<body>
<div class="row">
  <div class="swatch d" style="background:#6E0246"><span><span class="name">Secondary dark 1</span><br><span class="token">$color-secondary-dark1</span></span><span class="hex">#6E0246</span></div>
  <div class="swatch d" style="background:#9D0364"><span><span class="name">Secondary ★</span><br><span class="token">$color-secondary</span></span><span class="hex">#9D0364</span></div>
  <div class="swatch d" style="background:#BA4F93"><span><span class="name">Secondary light 1</span><br><span class="token">$color-secondary-light1</span></span><span class="hex">#BA4F93</span></div>
  <div class="swatch l" style="background:#D89AC1"><span><span class="name">Secondary light 2</span><br><span class="token">$color-secondary-light2</span></span><span class="hex">#D89AC1</span></div>
</div>
</body></html>
