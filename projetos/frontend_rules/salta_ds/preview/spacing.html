<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="$spacing-2 (4px) → $spacing-14 (80px)" viewport="700x360" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Nunito', sans-serif; color: #0F0F10; }
  .row { display: grid; grid-template-columns: 110px 1fr 60px; gap: 4px 14px; align-items: center; margin-bottom: 2px; }
  .token { font-family: 'Inconsolata', monospace; font-size: 11px; color: #65686E; }
  .px { font-family: 'Inconsolata', monospace; font-size: 11px; color: #0F0F10; text-align: right; }
  .bar { background: #8ACDD1; height: 14px; border-radius: 2px; border-left: 1px dashed #9747FF; border-right: 1px dashed #9747FF; }
</style></head>
<body>
  <div class="row"><div class="token">$spacing-2</div> <div><div class="bar" style="width:4px;"></div></div> <div class="px">4 px</div></div>
  <div class="row"><div class="token">$spacing-3</div> <div><div class="bar" style="width:8px;"></div></div> <div class="px">8 px</div></div>
  <div class="row"><div class="token">$spacing-4</div> <div><div class="bar" style="width:12px;"></div></div> <div class="px">12 px</div></div>
  <div class="row"><div class="token">$spacing-5</div> <div><div class="bar" style="width:16px;"></div></div> <div class="px">16 px</div></div>
  <div class="row"><div class="token">$spacing-6</div> <div><div class="bar" style="width:20px;"></div></div> <div class="px">20 px</div></div>
  <div class="row"><div class="token">$spacing-7</div> <div><div class="bar" style="width:24px;"></div></div> <div class="px">24 px</div></div>
  <div class="row"><div class="token">$spacing-8</div> <div><div class="bar" style="width:32px;"></div></div> <div class="px">32 px</div></div>
  <div class="row"><div class="token">$spacing-9</div> <div><div class="bar" style="width:40px;"></div></div> <div class="px">40 px</div></div>
  <div class="row"><div class="token">$spacing-10</div><div><div class="bar" style="width:48px;"></div></div> <div class="px">48 px</div></div>
  <div class="row"><div class="token">$spacing-11</div><div><div class="bar" style="width:56px;"></div></div> <div class="px">56 px</div></div>
  <div class="row"><div class="token">$spacing-12</div><div><div class="bar" style="width:64px;"></div></div> <div class="px">64 px</div></div>
  <div class="row"><div class="token">$spacing-13</div><div><div class="bar" style="width:72px;"></div></div> <div class="px">72 px</div></div>
  <div class="row"><div class="token">$spacing-14</div><div><div class="bar" style="width:80px;"></div></div> <div class="px">80 px</div></div>
</body></html>
