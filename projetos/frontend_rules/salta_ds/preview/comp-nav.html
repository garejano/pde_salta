<!doctype html>
<!-- @dsCard group="Components" name="Tab · Breadcrumb · Pagination" subtitle="Navegação horizontal — 3 padrões" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
<style>
  body { margin:0; padding:20px; background:#fff; font-family:'Nunito',sans-serif; }
  /* Tab bar */
  .tabbar { display:flex; border-bottom:2px solid #EBEDF1; gap:0; }
  .tab { display:flex; align-items:center; gap:8px; padding:14px 24px; font-family:'Archivo'; font-weight:700; font-size:14px; color:#65686E; border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; transition:color 160ms, border-color 160ms; white-space:nowrap; }
  .tab.active { color:#242CC2; border-bottom-color:#242CC2; }
  .tab:hover:not(.active) { color:#3D3F42; }
  .tab .material-symbols-outlined { font-size:18px; }
  /* Breadcrumb */
  .bc { display:flex; align-items:center; gap:4px; margin-top:20px; }
  .bc a { font-family:'Nunito'; font-size:12px; color:#242CC2; text-decoration:underline; cursor:pointer; }
  .bc span { font-family:'Nunito'; font-size:12px; color:#65686E; }
  .bc .sep { font-family:'Nunito'; font-size:12px; color:#C3C8D1; }
  /* Pagination */
  .pages { display:flex; gap:4px; align-items:center; margin-top:20px; }
  .pg { width:32px; height:32px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:'Nunito'; font-size:14px; cursor:pointer; transition:background 120ms; color:#3D3F42; }
  .pg:hover { background:#F8F9FB; }
  .pg.active { background:#242CC2; color:#fff; }
  .pg.arrow { color:#65686E; }
  .pg.disabled { color:#C3C8D1; cursor:default; }
  .pg .material-symbols-outlined { font-size:18px; }
</style></head>
<body>

<div class="tabbar">
  <div class="tab active"><span class="material-symbols-outlined">school</span>Turmas</div>
  <div class="tab"><span class="material-symbols-outlined">fact_check</span>Frequência</div>
  <div class="tab"><span class="material-symbols-outlined">grade</span>Notas</div>
  <div class="tab">Documentos</div>
</div>

<div class="bc">
  <a>Visão geral</a><span class="sep">/</span>
  <a>Alunos</a><span class="sep">/</span>
  <span>Maria Silva Santos</span>
</div>

<div class="pages">
  <div class="pg arrow disabled"><span class="material-symbols-outlined">chevron_left</span></div>
  <div class="pg active">1</div>
  <div class="pg">2</div>
  <div class="pg">3</div>
  <div class="pg" style="letter-spacing:.1em;color:#C3C8D1">...</div>
  <div class="pg">12</div>
  <div class="pg arrow"><span class="material-symbols-outlined">chevron_right</span></div>
</div>

</body></html>
