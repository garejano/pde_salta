<!doctype html>
<!-- @dsCard group="Components" name="Card" subtitle="Student card with stats" viewport="700x300" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  body { margin:0; padding:20px; background:#F8F9FB; font-family:'Nunito'; }
  .card { width:360px; background:#fff; border-radius:8px; box-shadow:0 4px 12px -2px rgba(0,23,31,.15); overflow:hidden; }
  .hdr { display:flex; gap:12px; padding:16px; align-items:center; border-bottom:1px solid #EBEDF1; }
  .avatar { width:48px; height:48px; border-radius:999px; background:linear-gradient(135deg,#30B7BE,#39D881); color:#fff; display:flex;align-items:center;justify-content:center; font-family:'Archivo';font-weight:700;font-size:18px; }
  .who { flex:1; }
  .who h4 { margin:0; font-family:'Nunito';font-weight:700;font-size:16px;color:#0F0F10; }
  .who p { margin:2px 0 0;font-family:'Nunito';font-size:12px;color:#65686E; }
  .body { padding:16px; }
  .stats { display:flex; gap:8px; }
  .stat { flex:1; background:#F8F9FB; border-radius:8px; padding:10px 12px; }
  .stat .k { font-family:'Nunito';font-size:12px;color:#65686E; }
  .stat .v { font-family:'Archivo';font-weight:700;font-size:20px;color:#0F0F10; }
  .ft { padding:12px 16px; border-top:1px solid #EBEDF1; display:flex; justify-content:flex-end; gap:8px; }
  .btn { font-family:'Archivo';font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;border:0;cursor:pointer; }
  .fill { background:#242CC2;color:#fff; } .ghost { background:transparent;color:#242CC2; }
</style></head><body>
<div class="card">
  <div class="hdr">
    <div class="avatar">MS</div>
    <div class="who"><h4>Maria Silva</h4><p>1 ano A — Militar · 12/02/2022 às 13:30</p></div>
    <span class="material-symbols-outlined" style="color:#65686E">more_vert</span>
  </div>
  <div class="body">
    <div class="stats">
      <div class="stat"><div class="k">Faltas</div><div class="v">3</div></div>
      <div class="stat"><div class="k">Atrasos</div><div class="v">2</div></div>
      <div class="stat"><div class="k">Média</div><div class="v">8,4</div></div>
    </div>
  </div>
  <div class="ft">
    <button class="btn ghost">Cancelar</button>
    <button class="btn fill">Ver ficha</button>
  </div>
</div>
</body></html>
