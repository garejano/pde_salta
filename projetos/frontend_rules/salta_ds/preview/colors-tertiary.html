<!doctype html>
<!-- @dsCard group="Colors" name="Tertiary color scale" subtitle="$color-tertiary (teal) · brand mark origin" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .swatch { flex: 1; min-height: 96px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; font-family: 'Nunito', sans-serif; }
  .swatch .name { font-weight: 700; font-family: 'Archivo'; font-size: 11px; line-height: 1.1; }
  .swatch .hex  { font-family: 'Inconsolata', monospace; font-size: 11px; opacity: .85; }
  .swatch .token{ font-family: 'Inconsolata', monospace; font-size: 10px; opacity: .7; }
  .l { color: #0F0F10; }
  .d { color: #fff; }
</style></head>
<body>
<div class="row">
  <div class="swatch d" style="background:#228085"><span><span class="name">Tertiary dark 1</span><br><span class="token">$color-tertiary-dark1</span></span><span class="hex">#228085</span></div>
  <div class="swatch d" style="background:#30B7BE"><span><span class="name">Tertiary ★ · brand</span><br><span class="token">$color-tertiary</span></span><span class="hex">#30B7BE</span></div>
  <div class="swatch l" style="background:#6ECDD1"><span><span class="name">Tertiary light 1</span><br><span class="token">$color-tertiary-light1</span></span><span class="hex">#6ECDD1</span></div>
  <div class="swatch l" style="background:#ACE2E5"><span><span class="name">Tertiary light 2</span><br><span class="token">$color-tertiary-light2</span></span><span class="hex">#ACE2E5</span></div>
</div>
</body></html>
