<!doctype html>
<!-- @dsCard group="Spacing" name="Border radii & widths" subtitle="$border-radius-0..5 · $border-width-0..4" viewport="700x320" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: 'Nunito', sans-serif; color: #0F0F10; }
  .section { display: flex; gap: 16px; margin-bottom: 18px; align-items: flex-end; }
  .cell { text-align: center; flex: 1; }
  .box { height: 72px; background: #ECEDFF; border: 1px solid #242CC2; margin: 0 auto 8px; width: 100%; }
  .label { font-family: 'Inconsolata', monospace; font-size: 11px; color: #0F0F10; line-height: 1.3; }
  .token { font-family: 'Inconsolata', monospace; font-size: 10px; color: #65686E; }
  .head { font-family: 'Archivo'; font-size: 12px; font-weight: 700; color: #242CC2; margin-bottom: 10px; letter-spacing: .04em; text-transform: uppercase; }
  .wbox { height: 56px; background: #FFFFFF; border-color: #0F0F10; border-style: solid; margin: 0 auto 8px; }
</style></head>
<body>
  <div class="head">Border radius</div>
  <div class="section">
    <div class="cell"><div class="box" style="border-radius:0;"></div><div class="label">0 px</div><div class="token">$border-radius-0</div></div>
    <div class="cell"><div class="box" style="border-radius:4px;"></div><div class="label">4 px</div><div class="token">$border-radius-1</div></div>
    <div class="cell"><div class="box" style="border-radius:8px;"></div><div class="label">8 px ★</div><div class="token">$border-radius-2</div></div>
    <div class="cell"><div class="box" style="border-radius:12px;"></div><div class="label">12 px</div><div class="token">$border-radius-3</div></div>
    <div class="cell"><div class="box" style="border-radius:16px;"></div><div class="label">16 px</div><div class="token">$border-radius-4</div></div>
    <div class="cell"><div class="box" style="border-radius:32px;"></div><div class="label">32 px</div><div class="token">$border-radius-5</div></div>
  </div>

  <div class="head">Border width</div>
  <div class="section">
    <div class="cell"><div class="wbox" style="border-width:0;"></div><div class="label">0 px</div><div class="token">$border-width-0</div></div>
    <div class="cell"><div class="wbox" style="border-width:1px;"></div><div class="label">1 px ★</div><div class="token">$border-width-1</div></div>
    <div class="cell"><div class="wbox" style="border-width:2px;"></div><div class="label">2 px</div><div class="token">$border-width-2</div></div>
    <div class="cell"><div class="wbox" style="border-width:3px;"></div><div class="label">3 px</div><div class="token">$border-width-3</div></div>
    <div class="cell"><div class="wbox" style="border-width:4px;"></div><div class="label">4 px</div><div class="token">$border-width-4</div></div>
  </div>
</body></html>
