<!doctype html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Material Symbols Outlined" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  body { margin:0; padding:18px; background:#fff; font-family:'Nunito'; }
  .grid { display:grid; grid-template-columns: repeat(8, 1fr); gap:14px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:6px; color:#0F0F10; }
  .material-symbols-outlined { font-size:28px; color:#0F0F10; }
  .t { font-family:'Inconsolata', monospace; font-size:10px; color:#65686E; }
</style></head><body>
<div class="grid">
  <div class="cell"><span class="material-symbols-outlined">star</span><span class="t">star</span></div>
  <div class="cell"><span class="material-symbols-outlined">notifications</span><span class="t">notif.</span></div>
  <div class="cell"><span class="material-symbols-outlined">person</span><span class="t">person</span></div>
  <div class="cell"><span class="material-symbols-outlined">school</span><span class="t">school</span></div>
  <div class="cell"><span class="material-symbols-outlined">edit</span><span class="t">edit</span></div>
  <div class="cell"><span class="material-symbols-outlined">delete</span><span class="t">delete</span></div>
  <div class="cell"><span class="material-symbols-outlined">download</span><span class="t">download</span></div>
  <div class="cell"><span class="material-symbols-outlined">upload</span><span class="t">upload</span></div>
  <div class="cell"><span class="material-symbols-outlined">search</span><span class="t">search</span></div>
  <div class="cell"><span class="material-symbols-outlined">menu</span><span class="t">menu</span></div>
  <div class="cell"><span class="material-symbols-outlined">close</span><span class="t">close</span></div>
  <div class="cell"><span class="material-symbols-outlined">expand_more</span><span class="t">expand</span></div>
  <div class="cell"><span class="material-symbols-outlined">check_circle</span><span class="t">check</span></div>
  <div class="cell"><span class="material-symbols-outlined">error</span><span class="t">error</span></div>
  <div class="cell"><span class="material-symbols-outlined">info</span><span class="t">info</span></div>
  <div class="cell"><span class="material-symbols-outlined">warning</span><span class="t">warning</span></div>
</div>
</body></html>
