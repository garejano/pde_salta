<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuração — Diário de Classe</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-canvas); }
  body { font-family: var(--font-body-family); color: var(--fg-primary); }
  .material-symbols-outlined { font-variation-settings: 'opsz' 24, 'wght' 400, 'FILL' 0, 'GRAD' 0; }

  /* ---------- page shell ---------- */
  .page { max-width: 1180px; margin: 0 auto; padding: 40px 40px 80px; }
  .page-title { font-family: var(--font-display-family); font-weight: 600; font-size: 32px;
    line-height: 40px; color: var(--color-neutral-dark3); margin: 0 0 24px; }

  /* tabs */
  .tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--color-neutral-light1); margin-bottom: 32px; }
  .tab { appearance: none; border: 0; background: none; cursor: pointer; padding: 10px 2px 14px;
    font-family: var(--font-display-family); font-weight: 600; font-size: 15px; color: var(--fg-muted);
    border-bottom: 3px solid transparent; margin-bottom: -1px; transition: color var(--motion-fast-2); }
  .tab:hover { color: var(--color-neutral-dark2); }
  .tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: 384px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  /* ---------- unified panel ---------- */
  .panel { background: var(--bg-canvas); border: 1px solid var(--color-neutral-light2);
    border-radius: 12px; box-shadow: var(--shadow-down-small); overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 20px 24px;
    background: var(--color-neutral-light3); border-bottom: 1px solid var(--color-neutral-light2); }
  .panel-head .ph-icon { width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
    display: grid; place-items: center; background: var(--color-primary-light3); color: var(--color-primary); }
  .panel-head .ph-icon .material-symbols-outlined { font-size: 22px; }
  .panel-head .ph-t { font-family: var(--font-display-family); font-weight: 600; font-size: 16px;
    color: var(--color-neutral-dark3); }
  .panel-head .ph-s { font-size: 12px; color: var(--fg-muted); margin-top: 1px; }
  .panel-body { padding: 22px 24px 24px; }

  .ovl { font-family: var(--font-display-family); font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-muted); margin: 0 0 10px; }

  /* select */
  .select-wrap { position: relative; }
  .ds-select { appearance: none; width: 100%; height: 46px; padding: 0 42px 0 16px;
    border: 1px solid var(--color-neutral-light1); border-radius: 8px; background: var(--color-white);
    font-family: var(--font-body-family); font-size: 15px; color: var(--color-neutral-dark3); cursor: pointer;
    transition: border-color var(--motion-fast-2), box-shadow var(--motion-fast-2); }
  .ds-select:hover { border-color: var(--color-neutral); }
  .ds-select:focus { outline: 0; border-color: var(--color-primary); box-shadow: var(--shadow-focus); }
  .ds-select.placeholder { color: var(--fg-muted); }
  .select-wrap .chev { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--fg-muted); font-size: 22px; }
  .select-loading { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px;
    border: 1px dashed var(--color-neutral-light1); border-radius: 8px; color: var(--fg-muted); font-size: 14px; }

  .divider { height: 1px; background: var(--color-neutral-light2); margin: 22px -24px; }

  /* config locked (no rede) */
  .locked { display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 10px; padding: 30px 16px 24px; }
  .locked .lk-ic { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
    background: var(--color-neutral-light3); border: 1px solid var(--color-neutral-light2); color: var(--color-neutral); }
  .locked .lk-ic .material-symbols-outlined { font-size: 30px; }
  .locked .lk-t { font-family: var(--font-display-family); font-weight: 600; font-size: 15px; color: var(--color-neutral-dark2); }
  .locked .lk-s { font-size: 13px; line-height: 19px; color: var(--fg-muted); max-width: 240px; }

  /* config loading */
  .cfg-loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0; color: var(--fg-muted); font-size: 14px; }

  /* spinner */
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--color-primary-light2);
    border-top-color: var(--color-primary); animation: spin 720ms linear infinite; }
  .spin.sm { width: 18px; height: 18px; border-width: 2.5px; }
  .spin.white { border-color: rgba(255,255,255,0.45); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* empty-config alert */
  .empty-alert { display: flex; gap: 12px; padding: 14px 16px 14px 14px; border-radius: 10px;
    background: color-mix(in srgb, var(--color-warning) 14%, white);
    border: 1px solid color-mix(in srgb, var(--color-warning) 42%, white);
    margin-bottom: 18px; }
  .empty-alert .ea-ic { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
    background: color-mix(in srgb, var(--color-warning) 26%, white); color: var(--color-warning-dark); }
  .empty-alert .ea-ic .material-symbols-outlined { font-size: 20px; }
  .empty-alert .ea-t { font-family: var(--font-body-family); font-weight: 700; font-size: 13.5px; color: var(--color-neutral-dark3); }
  .empty-alert .ea-s { font-size: 12.5px; line-height: 18px; color: var(--color-neutral-dark2); margin-top: 2px; }

  /* char rows */
  .char-list { display: flex; flex-direction: column; gap: 2px; }
  .char-row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 12px;
    padding: 9px 12px; border-radius: 9px; border-left: 3px solid transparent;
    transition: background var(--motion-moderate-1), border-color var(--motion-moderate-1); }
  .char-row.active { background: color-mix(in srgb, var(--accent) 9%, white); border-left-color: var(--accent); }
  .char-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .char-meta .cm-label { font-family: var(--font-body-family); font-weight: 700; font-size: 14px; color: var(--color-neutral-dark3); }
  .char-meta .cm-sub { font-size: 11.5px; line-height: 15px; color: var(--fg-muted); margin-top: 1px; }
  .char-badge { width: 46px; height: 46px; border-radius: 9px; border: 1px solid transparent;
    background: var(--color-primary-light3); color: var(--color-primary); font-family: var(--font-display-family);
    font-weight: 700; font-size: 20px; text-align: center; padding: 0; outline: none; caret-color: var(--color-primary);
    transition: border-color var(--motion-fast-2), box-shadow var(--motion-fast-2), background var(--motion-fast-2); }
  .char-badge:hover { border-color: var(--color-primary-light2); }
  .char-badge:focus { border-color: var(--color-primary); box-shadow: var(--shadow-focus); background: #fff; }

  /* save + error */
  .save-row { margin-top: 20px; }
  .btn-save { width: 100%; height: 48px; border: 0; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--color-primary); color: #fff; font-family: var(--font-display-family); font-weight: 700; font-size: 16px;
    transition: background var(--motion-fast-2); }
  .btn-save:hover { background: var(--color-primary-dark1); }
  .btn-save:active { background: var(--accent-pressed); }
  .btn-save .material-symbols-outlined { font-size: 20px; }
  .btn-save.saved { background: var(--color-positive); }
  .btn-save.saved:hover { background: var(--color-positive); }
  .btn-save:disabled { cursor: default; }

  .err-banner { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 11px 14px;
    border-radius: 8px; background: color-mix(in srgb, var(--color-error) 12%, white);
    border: 1px solid color-mix(in srgb, var(--color-error) 38%, white);
    color: var(--color-error-dark); font-size: 13px; font-weight: 600; }
  .err-banner .material-symbols-outlined { font-size: 19px; color: var(--color-error); }

  /* ---------- v2: top bar + two-column ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    background: var(--bg-canvas); border: 1px solid var(--color-neutral-light2); border-radius: 12px;
    box-shadow: var(--shadow-down-small); padding: 16px 22px; margin-bottom: 24px; }
  .tb-left { display: flex; align-items: center; gap: 12px; }
  .tb-right { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .tb-field { display: flex; flex-direction: column; gap: 6px; }
  .tb-field .ovl { margin: 0; }
  .tb-field .select-wrap, .tb-field .select-loading { width: 300px; }
  .btn-save.tb-save { width: auto; height: 46px; padding: 0 22px; flex-shrink: 0; }
  .btn-save.inactive, .btn-save.inactive:hover { background: var(--color-neutral-light2); color: var(--fg-disabled); }
  .topbar-err { margin: -8px 0 24px; }

  .layout2 { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .layout2 { grid-template-columns: 1fr; } }
  .charcard { background: var(--bg-canvas); border: 1px solid var(--color-neutral-light2); border-radius: 12px;
    box-shadow: var(--shadow-down-small); padding: 16px 20px; }
  .charcard .empty-alert:first-child { margin-top: 4px; }

  /* ---------- preview ---------- */
  .preview-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .legend-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px 6px 11px;
    border-radius: 999px; border: 1px solid var(--color-neutral-light2); background: #fff;
    transition: border-color var(--motion-moderate-1), background var(--motion-moderate-1); }
  .legend-chip .lc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .legend-chip .lc-char { font-family: var(--font-display-family); font-weight: 700; font-size: 13px;
    color: var(--color-primary); min-width: 14px; text-align: center; transition: color var(--motion-moderate-1); }
  .legend-chip .lc-label { font-family: var(--font-body-family); font-size: 13px; color: var(--fg-secondary); }
  .legend-chip.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, white); }
  .legend-chip.active .lc-char { color: var(--accent); }

  .doc { border: 1px solid var(--color-neutral-light2); border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow-down-small); background: #fff; }
  .ptable { width: 100%; border-collapse: collapse; }
  .ptable thead tr { background: var(--color-neutral-light1); }
  .ptable th { padding: 11px 14px; text-align: left; font-family: var(--font-body-family); font-weight: 700;
    font-size: 13px; color: var(--color-neutral-dark2); white-space: nowrap; }
  .ptable th.c { text-align: center; }
  .ptable th.r { text-align: right; }
  .ptable td { padding: 12px 14px; border-bottom: 1px solid var(--color-neutral-light2);
    font-family: var(--font-body-family); font-size: 14px; color: var(--color-neutral-dark2); white-space: nowrap; }
  .ptable tbody tr:last-child td { border-bottom: 0; }
  .ptable tbody tr:nth-child(even) td { background: var(--color-neutral-light3); }
  .ptable .num { color: var(--fg-muted); text-align: center; width: 44px; }
  .ptable .nm { font-weight: 600; color: var(--color-neutral-dark3); }
  .ptable .mat { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .ptable .ft { text-align: center; font-family: var(--font-display-family); font-weight: 700; font-size: 14px;
    color: var(--color-primary); transition: background var(--motion-moderate-1), color var(--motion-moderate-1); }
  .ptable .ft.hl { background: color-mix(in srgb, var(--accent) 16%, white); color: var(--accent); }
  .ptable .faltas { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--color-neutral-dark3); }
  .ptable .faltas.zero { color: var(--fg-muted); font-weight: 400; }
  .doc-note { padding: 12px 16px; font-family: var(--font-body-family); font-style: italic; font-size: 12px;
    color: var(--fg-muted); background: var(--color-neutral-light3); border-top: 1px solid var(--color-neutral-light2); }

  .fade-in { animation: fadeIn var(--motion-moderate-2); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const MS = ({ name, style }) => <span className="material-symbols-outlined" style={style}>{name}</span>;

const TYPES = [
  { key: 'presenca',      label: 'Presença',      sub: 'Aluno presente',                       accent: '#28975A', def: 'P' },
  { key: 'falta',         label: 'Falta',         sub: 'Aluno ausente',                        accent: '#E65637', def: 'F' },
  { key: 'pendencia',     label: 'Pendência',     sub: 'Frequência não lançada',               accent: '#65686E', def: '-' },
  { key: 'transferencia', label: 'Transferência', sub: 'Aluno transferido',                    accent: '#774BB0', def: 'T' },
  { key: 'nee',           label: 'NEE',           sub: 'Necessidades educacionais especiais',  accent: '#228085', def: 'N' },
];
const ACCENT = Object.fromEntries(TYPES.map(t => [t.key, t.accent]));
const DEFAULTS = Object.fromEntries(TYPES.map(t => [t.key, t.def]));

// Redes — algumas com configuração salva, "Ábaco" sem configuração.
const REDES = [
  { id: 'abaco',   nome: 'Ábaco',                 config: null },
  { id: 'salta',   nome: 'Rede Salta',            config: { presenca: 'P', falta: 'F', pendencia: '·', transferencia: 'T', nee: 'E' } },
  { id: 'militar', nome: 'Colégio Militar Dom Pedro', config: { presenca: 'P', falta: 'A', pendencia: '-', transferencia: 'T', nee: 'N' } },
  { id: 'pueri',   nome: 'Rede Pueri Domus',      config: { presenca: 'P', falta: 'F', pendencia: '/', transferencia: 'T', nee: 'N' } },
];

const DATES = ['28/01', '29/01', '30/01', '03/02', '04/02'];
const STUDENTS = [
  { n: 1, name: 'Ana Carolina Lima',    mat: '2024001', freq: ['presenca','falta','presenca','presenca','presenca'] },
  { n: 2, name: 'Bruno Henrique Souza', mat: '2024002', freq: ['presenca','presenca','nee','presenca','presenca'] },
  { n: 3, name: 'Camila Rodrigues',     mat: '2024003', freq: ['falta','presenca','presenca','transferencia','presenca'] },
  { n: 4, name: 'Diego Alves Moreira',  mat: '2024004', freq: ['presenca','presenca','pendencia','presenca','presenca'] },
  { n: 5, name: 'Eduarda Santos',       mat: '2024005', freq: ['presenca','presenca','presenca','presenca','presenca'] },
  { n: 6, name: 'Felipe Mendes Rocha',  mat: '2024006', freq: ['falta','presenca','falta','presenca','presenca'] },
];

function App() {
  const params = new URLSearchParams(location.search);
  const qsRede = params.get('rede');
  const initRedeId = REDES.find(r => r.id === qsRede) ? qsRede : '';
  const initRede = REDES.find(r => r.id === initRedeId);

  const [tab, setTab] = useState('config');
  const [redesLoading, setRedesLoading] = useState(!initRedeId);
  const [redeId, setRedeId] = useState(initRedeId);
  const [cfgLoading, setCfgLoading] = useState(false);
  const [chars, setChars] = useState(initRede ? (initRede.config || DEFAULTS) : DEFAULTS);
  const [hasConfig, setHasConfig] = useState(initRede ? !!initRede.config : true);
  const [focusType, setFocusType] = useState(null);
  const [saveState, setSaveState] = useState('idle');   // idle | saving | saved
  const [error, setError] = useState('');
  const savedTimer = useRef(null);

  // carrega lista de redes ao montar (pulado se já há rede via querystring)
  useEffect(() => {
    if (initRedeId) return;
    const t = setTimeout(() => setRedesLoading(false), 950);
    return () => clearTimeout(t);
  }, []);

  const selectRede = (id) => {
    setRedeId(id);
    setError('');
    setSaveState('idle');
    setFocusType(null);
    if (!id) return;
    setCfgLoading(true);
    setTimeout(() => {
      const rede = REDES.find(r => r.id === id);
      if (rede.config) { setChars(rede.config); setHasConfig(true); }
      else { setChars(DEFAULTS); setHasConfig(false); }
      setCfgLoading(false);
    }, 700);
  };

  const setChar = (key, val) => {
    const v = val.slice(0, 1);
    setChars(c => ({ ...c, [key]: v }));
    if (saveState !== 'idle') setSaveState('idle');
    if (error) setError('');
  };

  const save = () => {
    const empties = TYPES.filter(t => !chars[t.key] || !chars[t.key].trim());
    if (empties.length) { setError('Preencha todos os caracteres de frequência antes de salvar.'); return; }
    setError('');
    setSaveState('saving');
    clearTimeout(savedTimer.current);
    setTimeout(() => {
      setSaveState('saved');
      setHasConfig(true);
      savedTimer.current = setTimeout(() => setSaveState('idle'), 2500);
    }, 750);
  };

  const rede = REDES.find(r => r.id === redeId);
  const showConfig = redeId && !cfgLoading;

  return (
    <div className="page">
      <h1 className="page-title">Diário de Classe</h1>
      <div className="tabs">
        <button className={'tab' + (tab === 'diario' ? ' active' : '')} onClick={() => setTab('diario')}>Diário de Classe</button>
        <button className={'tab' + (tab === 'config' ? ' active' : '')} onClick={() => setTab('config')}>Configuração</button>
      </div>

      {tab === 'diario' ? (
        <div className="locked" style={{ padding: '64px 0' }}>
          <div className="lk-ic"><MS name="event_note" /></div>
          <div className="lk-t">Diário de Classe</div>
          <div className="lk-s">Esta aba faz parte do fluxo principal e não está incluída neste protótipo de configuração.</div>
        </div>
      ) : (
        <>
          <div className="topbar">
            <div className="tb-left">
              <div className="ph-icon"><MS name="tune" /></div>
              <div>
                <div className="ph-t">Caracteres do diário</div>
                <div className="ph-s">Defina os símbolos de frequência por rede</div>
              </div>
            </div>
            <div className="tb-right">
              <div className="tb-field">
                <div className="ovl">Rede de ensino</div>
                {redesLoading ? (
                  <div className="select-loading"><div className="spin sm"></div>Carregando redes…</div>
                ) : (
                  <div className="select-wrap">
                    <select
                      className={'ds-select' + (redeId ? '' : ' placeholder')}
                      value={redeId}
                      onChange={(e) => selectRede(e.target.value)}>
                      <option value="">Selecione a rede</option>
                      {REDES.map(r => <option key={r.id} value={r.id}>{r.nome}</option>)}
                    </select>
                    <span className="material-symbols-outlined chev">expand_more</span>
                  </div>
                )}
              </div>
              <button
                className={'btn-save tb-save' + (saveState === 'saved' ? ' saved' : '') + (!showConfig ? ' inactive' : '')}
                onClick={save}
                disabled={!showConfig || saveState === 'saving'}>
                {saveState === 'saving' && <><div className="spin sm white"></div>Salvando…</>}
                {saveState === 'saved' && <><MS name="check" />Salvo!</>}
                {saveState === 'idle' && <><MS name="save" />Salvar configuração</>}
              </button>
            </div>
          </div>

          {error && (
            <div className="err-banner topbar-err"><MS name="error" />{error}</div>
          )}

          <div className="layout2">
            {/* ---------------- CARACTERES ---------------- */}
            <section className="charcard">
              {!redeId && (
                <div className="locked">
                  <div className="lk-ic"><MS name="touch_app" /></div>
                  <div className="lk-t">Selecione uma rede</div>
                  <div className="lk-s">Escolha uma rede na barra acima para visualizar e editar os caracteres de frequência.</div>
                </div>
              )}

              {redeId && cfgLoading && (
                <div className="cfg-loading"><div className="spin"></div>Carregando configuração…</div>
              )}

              {showConfig && (
                <div className="fade-in" key={redeId}>
                  {!hasConfig && (
                    <div className="empty-alert">
                      <div className="ea-ic"><MS name="info" /></div>
                      <div>
                        <div className="ea-t">Sem configuração salva</div>
                        <div className="ea-s">{rede.nome} ainda não possui caracteres definidos. Os valores abaixo são os padrões — salve para criar a configuração.</div>
                      </div>
                    </div>
                  )}

                  <div className="char-list">
                    {TYPES.map(t => (
                      <div
                        key={t.key}
                        className={'char-row' + (focusType === t.key ? ' active' : '')}
                        style={{ '--accent': t.accent }}>
                        <span className="char-dot"></span>
                        <div className="char-meta">
                          <div className="cm-label">{t.label}</div>
                          <div className="cm-sub">{t.sub}</div>
                        </div>
                        <input
                          className="char-badge"
                          maxLength={1}
                          value={chars[t.key]}
                          aria-label={t.label}
                          onChange={(e) => setChar(t.key, e.target.value)}
                          onFocus={() => setFocusType(t.key)}
                          onBlur={() => setFocusType(null)}
                          onMouseEnter={() => setFocusType(t.key)}
                          onMouseLeave={() => { if (document.activeElement?.getAttribute?.('aria-label') !== t.label) setFocusType(null); }}
                        />
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </section>

            {/* ---------------- PREVIEW ---------------- */}
            <section>
              <div className="preview-head">
                <div className="ovl" style={{ margin: 0 }}>Exemplo de exibição no documento</div>
              </div>

            <div className="legend">
              {TYPES.map(t => (
                <div
                  key={t.key}
                  className={'legend-chip' + (focusType === t.key ? ' active' : '')}
                  style={{ '--accent': t.accent }}
                  onMouseEnter={() => setFocusType(t.key)}
                  onMouseLeave={() => setFocusType(null)}>
                  <span className="lc-dot"></span>
                  <span className="lc-char">{chars[t.key] || '·'}</span>
                  <span className="lc-label">{t.label}</span>
                </div>
              ))}
            </div>

            <div className="doc">
              <table className="ptable">
                <thead>
                  <tr>
                    <th className="c">Nº</th>
                    <th>Nome do aluno</th>
                    <th>Matrícula</th>
                    {DATES.map(d => <th key={d} className="c">{d}</th>)}
                    <th className="r">Faltas</th>
                  </tr>
                </thead>
                <tbody>
                  {STUDENTS.map(s => {
                    const faltas = s.freq.filter(f => f === 'falta').length;
                    return (
                      <tr key={s.n}>
                        <td className="num">{s.n}</td>
                        <td className="nm">{s.name}</td>
                        <td className="mat">{s.mat}</td>
                        {s.freq.map((f, i) => (
                          <td
                            key={i}
                            className={'ft' + (focusType === f ? ' hl' : '')}
                            style={{ '--accent': ACCENT[f] }}>
                            {chars[f] || '·'}
                          </td>
                        ))}
                        <td className={'faltas' + (faltas === 0 ? ' zero' : '')}>{faltas}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              <div className="doc-note">Dados fictícios. Não representam alunos reais.</div>
            </div>
          </section>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
